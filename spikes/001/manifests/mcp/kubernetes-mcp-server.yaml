# kubernetes-mcp-server v0.0.67, read-only, `core` toolset only, OTel on.
# Its ServiceAccount can get/list/watch in the scenery namespaces and nothing
# else: no Secrets, no pods/exec|attach|portforward, no write verb, no
# wildcard, no cluster-wide right. Same rules as the product (spec 04 guard).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-server
  namespace: mcp
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-mcp-server-read
  namespace: demo-apps
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, endpoints, configmaps, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-mcp-server-read
  namespace: demo-apps
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: kubernetes-mcp-server-read }
subjects:
  - { kind: ServiceAccount, name: kubernetes-mcp-server, namespace: mcp }
---
# The platform team's namespace: the ACK DBProxy of proxy-timeout.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-mcp-server-read
  namespace: ack-system
rules:
  - apiGroups: [rds.services.k8s.aws]
    resources: [dbproxies]
    verbs: [get, list, watch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-mcp-server-read
  namespace: ack-system
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: kubernetes-mcp-server-read }
subjects:
  - { kind: ServiceAccount, name: kubernetes-mcp-server, namespace: mcp }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-mcp-server
  namespace: mcp
data:
  config.toml: |
    port = "8080"
    stateless = true
    read_only = true
    toolsets = ["core"]

    [telemetry]
    enabled = true
    endpoint = "http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317"
    protocol = "grpc"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-server
  namespace: mcp
spec:
  replicas: 1
  selector:
    matchLabels: { app: kubernetes-mcp-server }
  template:
    metadata:
      labels: { app: kubernetes-mcp-server, takecare.spike/mcp: "true" }
      annotations:
        takecare.spike/config: "${KMS_CONFIG_SHA}"
    spec:
      serviceAccountName: kubernetes-mcp-server
      securityContext: { runAsNonRoot: true }
      containers:
        - name: server
          image: ${KUBERNETES_MCP_SERVER_IMAGE}
          args: ["--config", "/etc/kms/config.toml"]
          env:
            - { name: OTEL_SERVICE_NAME, value: kubernetes-mcp-server }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/kms }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: kubernetes-mcp-server }
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp-server
  namespace: mcp
spec:
  selector: { app: kubernetes-mcp-server }
  ports:
    - { name: http, port: 8080, targetPort: http }
