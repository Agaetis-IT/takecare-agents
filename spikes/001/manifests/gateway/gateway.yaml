# agentgateway v1.6.0: one Gateway, the model route, tracing.
# Field names checked against the v1.6.0 CRDs (agentgateway.dev/v1alpha1).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: All }
        kinds:
          - { group: gateway.networking.k8s.io, kind: HTTPRoute }
          # Opt-in for the built-in model routes (/v1/chat/completions, ...)
          - { group: agentgateway.dev, kind: AgentgatewayModel }
---
# The one model of the spike, for every engine. Gateway-attached models serve
# exact standard paths only in 1.6 (/v1/chat/completions, /v1/models, ...).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: default
  namespace: agentgateway-system
spec:
  parentRefs:
    - { group: gateway.networking.k8s.io, kind: Gateway, name: agentgateway-proxy, sectionName: http }
  match:
    model: ${MODEL}
  provider: Openrouter
  policies:
    auth:
      secretRef: { name: model-provider, key: apiKey }
---
# One OTLP exporter for the whole gateway. An incoming traceparent is continued.
# gen_ai.conversation.id is taken from a request header when the caller sets
# it: the fallback correlation of ADR 0006.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tracing
  namespace: agentgateway-system
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: Gateway, name: agentgateway-proxy }
  frontend:
    tracing:
      backendRef: { name: otel-collector-opentelemetry-collector, namespace: observability, port: 4317 }
      protocol: GRPC
      randomSampling: "true"
      attributes:
        add:
          - name: gen_ai.conversation.id
            expression: 'request.headers["x-conversation-id"]'
