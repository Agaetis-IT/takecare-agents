# kagent v1.0.0-alpha14 (api.kagent.dev/v1alpha3). Shared by the Doc agents.
# Namespace `kagent`: a Harness's worker pool must be in the agent's
# namespace, and the chart creates `kagent-default` in its release namespace.
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: doc-model
  namespace: kagent
spec:
  provider: OpenAI
  model: ${MODEL}
  openAI:
    # No key: with a custom base URL the Go ADK sends no Authorization; the
    # gateway holds the real key (ADR 0004).
    baseUrl: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/v1
    apiFormat: chatCompletions
---
# Go ADK runtime (the only usable one on the 1.0 line), on the default worker
# pool. `tracecontext,baggage` lets the Go ADK add gen_ai.conversation.id and
# the tool name as baggage on outbound calls.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: doc-go
  namespace: kagent
spec:
  kagent: {}
  env:
    - { name: OTEL_PROPAGATORS, value: "tracecontext,baggage" }
  substrate:
    workerPoolRef: { name: kagent-default }
    snapshotPolicy: { location: "s3://ate-snapshots/kagent" }
---
# A2A to kagent 1.0 agents goes through the gateway (ADR 0009); kagent's own
# path is /agents/<namespace>/<agent>.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: kagent-a2a
  namespace: agentgateway-system
spec:
  a2a: { host: kagent-controller.kagent.svc.cluster.local, port: 8083 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a-kagent
  namespace: agentgateway-system
spec:
  parentRefs: [{ name: agentgateway-proxy, sectionName: http }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /agents/ } }]
      backendRefs: [{ group: agentgateway.dev, kind: AgentgatewayBackend, name: kagent-a2a }]
