---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    helm.sh/resource-policy: keep
  name: takecareinvestigations.takecare.agaetis.fr
spec:
  group: takecare.agaetis.fr
  names:
    categories:
    - takecare
    kind: TakeCareInvestigation
    listKind: TakeCareInvestigationList
    plural: takecareinvestigations
    shortNames:
    - tcinvestigation
    singular: takecareinvestigation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.alert.name
      name: Alert
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.published.ok
      name: Published
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TakeCareInvestigation records one handled alert. It is created by the
          operator, never by a user, and doubles as the deduplication state.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TakeCareInvestigationSpec records the alert an investigation answers. The
              operator writes it once; it never changes (spec 02).
            properties:
              alert:
                description: AlertRecord is the alert as received.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    type: object
                  fingerprint:
                    description: Alertmanager's fingerprint of the alert.
                    type: string
                  firedAt:
                    format: date-time
                    type: string
                  labels:
                    additionalProperties:
                      type: string
                    type: object
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                  service:
                    type: string
                  workload:
                    description: |-
                      The workload the alert is about, from its labels: the incident key
                      with the namespace (spec 02 §1).
                    type: string
                required:
                - name
                type: object
              level:
                description: Level of the role when the investigation was created.
                enum:
                - trial
                - service
                - seasoned
                type: string
              roleRef:
                description: RoleRef names the role resource that owns an investigation.
                properties:
                  kind:
                    enum:
                    - TakeCareDoc
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
              silent:
                description: Silent investigations are never published (status only).
                type: boolean
            required:
            - alert
            - level
            - roleRef
            type: object
            x-kubernetes-validations:
            - message: the spec of an investigation is immutable
              rule: self == oldSelf
          status:
            description: |-
              TakeCareInvestigationStatus is the investigation's record: the shared run
              status, and what is the Doc's: the diagnosis, its publication, the other
              alerts of the same incident, the resolution.
            properties:
              alerts:
                description: |-
                  Other alerts of the same incident (same namespace and workload, within
                  the Doc's cooldown), handled by this investigation instead of their own.
                items:
                  description: GroupedAlert is an alert folded into an investigation
                    of the same incident.
                  properties:
                    fingerprint:
                      type: string
                    firedAt:
                      format: date-time
                      type: string
                    name:
                      type: string
                  required:
                  - fingerprint
                  - firedAt
                  - name
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
              attempts:
                description: |-
                  How many times the run was started: a task lost to a restart is
                  retried once, then the run fails with the reason.
                format: int32
                minimum: 0
                type: integer
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              degraded:
                description: |-
                  Set when the run went on without some of its sources (a connector
                  down): the output says so, the run is not failed for it.
                properties:
                  connectors:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  reason:
                    type: string
                type: object
              diagnosis:
                description: The agent's answer, unchanged.
                type: string
              engine:
                description: |-
                  Which engine ran it. Free strings: the engine is not an API concept,
                  only something the operator records (ADR 0007).
                properties:
                  agent:
                    type: string
                  kind:
                    type: string
                  taskID:
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  RunPhase is where a run of an agent role stands. The shared phases are
                  below; each record kind validates its own set, which may add phases.
                type: string
              published:
                description: Publication is the outcome of publishing the diagnosis.
                properties:
                  connector:
                    type: string
                  destination:
                    type: string
                  ok:
                    type: boolean
                  reason:
                    type: string
                required:
                - ok
                type: object
              reason:
                description: Why the run is in its phase, for Failed and Dropped.
                type: string
              resolvedAt:
                format: date-time
                type: string
              startedAt:
                format: date-time
                type: string
              traceID:
                type: string
              usage:
                description: Usage is the model usage of one run.
                properties:
                  approximate:
                    description: |-
                      True when the usage could not be attributed to this run alone: runs
                      overlapped, or another role shares the model (spec 02 §5).
                    type: boolean
                  cachedInputTokens:
                    format: int64
                    type: integer
                  estimatedCost:
                    description: Estimated cost with its currency, for example "0.0093
                      USD".
                    type: string
                  inputTokens:
                    format: int64
                    type: integer
                  modelCalls:
                    format: int64
                    type: integer
                  outputTokens:
                    format: int64
                    type: integer
                required:
                - inputTokens
                - modelCalls
                - outputTokens
                type: object
            type: object
            x-kubernetes-validations:
            - message: phase must be Queued, Running, Completed, Failed, TimedOut
                or Dropped
              rule: '!has(self.phase) || self.phase in [''Queued'', ''Running'', ''Completed'',
                ''Failed'', ''TimedOut'', ''Dropped'']'
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
