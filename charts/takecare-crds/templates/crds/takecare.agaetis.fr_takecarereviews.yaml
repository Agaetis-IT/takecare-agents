---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    helm.sh/resource-policy: keep
  name: takecarereviews.takecare.agaetis.fr
spec:
  group: takecare.agaetis.fr
  names:
    categories:
    - takecare
    kind: TakeCareReview
    listKind: TakeCareReviewList
    plural: takecarereviews
    shortNames:
    - tcreview
    singular: takecarereview
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.trigger
      name: Trigger
      type: string
    - jsonPath: .spec.incident
      name: Incident
      type: string
    - jsonPath: .status.actionCounts.total
      name: Actions
      type: integer
    - jsonPath: .status.actionCounts.open
      name: Open
      type: integer
    - jsonPath: .status.published.ok
      name: Published
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TakeCareReview is one review by the Kiné: the problem, its recurrences,
          the corrective actions and their state.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TakeCareReviewSpec records what a review answers. The operator, or a
              human for an on-demand review, writes it once; it never changes.
            properties:
              incident:
                description: |-
                  The incident key of those investigations (the Doc's label
                  takecare.agaetis.fr/incident).
                maxLength: 63
                type: string
              investigations:
                description: |-
                  The investigations under review, by name, oldest first; empty for a
                  periodic review.
                items:
                  maxLength: 253
                  type: string
                maxItems: 10
                type: array
                x-kubernetes-list-type: atomic
              kineRef:
                description: |-
                  RoleRef names the role resource that owns a record: an investigation,
                  a survey or a review.
                properties:
                  kind:
                    enum:
                    - TakeCareDoc
                    - TakeCareIntendant
                    - TakeCareKine
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
              level:
                description: |-
                  The Kiné's effective level when the review was created. Empty on a
                  review made by hand: the Kiné's effective level when it starts.
                enum:
                - Apprentice
                - Practitioner
                - Expert
                type: string
              period:
                description: The window the agent looks back over.
                properties:
                  from:
                    format: date-time
                    type: string
                  to:
                    format: date-time
                    type: string
                required:
                - from
                - to
                type: object
                x-kubernetes-validations:
                - message: a period's from is before its to
                  rule: self.from < self.to
              silent:
                description: Silent reviews are never published (status only).
                type: boolean
              trigger:
                default: OnDemand
                description: ReviewTrigger says what started a review (spec 11 §3).
                enum:
                - Investigation
                - Schedule
                - OnDemand
                type: string
            required:
            - kineRef
            type: object
            x-kubernetes-validations:
            - message: the spec of a review is immutable
              rule: self == oldSelf
            - message: a review belongs to a TakeCareKine
              rule: self.kineRef.kind == 'TakeCareKine'
            - message: a periodic review names no investigation and no incident
              rule: '!has(self.trigger) || self.trigger != ''Schedule'' || (!has(self.investigations)
                && !has(self.incident))'
            - message: a review after an incident names its investigations
              rule: '!has(self.trigger) || self.trigger != ''Investigation'' || (has(self.investigations)
                && size(self.investigations) > 0)'
          status:
            description: TakeCareReviewStatus is a review's run and what it found.
            properties:
              actionCounts:
                description: ActionCounts counts a review's actions, for its printer
                  columns.
                properties:
                  open:
                    description: 'The actions still to do: Proposed or Open.'
                    format: int32
                    minimum: 0
                    type: integer
                  total:
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - open
                - total
                type: object
              actions:
                items:
                  description: |-
                    CorrectiveAction is one action of the Rehab, tracked across a Kiné's
                    reviews by its id.
                  properties:
                    evidence:
                      items:
                        description: |-
                          Evidence is a tool call that backs a finding: the tool and the record it
                          read, never its output.
                        properties:
                          record:
                            maxLength: 253
                            type: string
                          tool:
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - tool
                        type: object
                      maxItems: 10
                      type: array
                      x-kubernetes-list-type: atomic
                    id:
                      description: Stable across reviews (spec 11 §2).
                      maxLength: 128
                      minLength: 1
                      type: string
                    kind:
                      description: ActionKind says what a corrective action changes.
                      enum:
                      - Runbook
                      - AlertRule
                      - Check
                      - Configuration
                      - Other
                      type: string
                    origin:
                      description: ActionOrigin says where an action comes from.
                      enum:
                      - Earlier
                      - New
                      type: string
                    source:
                      description: |-
                        Where an earlier action comes from: a knowledge record's id or an
                        earlier review's name.
                      maxLength: 253
                      type: string
                    state:
                      description: ActionState is where an action stands, as the evidence
                        says.
                      enum:
                      - Proposed
                      - Open
                      - Done
                      - Unknown
                      type: string
                    text:
                      maxLength: 512
                      minLength: 1
                      type: string
                  required:
                  - id
                  - kind
                  - origin
                  - state
                  - text
                  type: object
                  x-kubernetes-validations:
                  - message: a new action is Proposed, an earlier one is Open, Done
                      or Unknown
                    rule: 'self.origin == ''New'' ? self.state == ''Proposed'' : self.state
                      != ''Proposed'''
                maxItems: 20
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              actionsOmitted:
                description: How many actions the answer held past the ones kept.
                format: int32
                minimum: 0
                type: integer
              attempts:
                description: |-
                  How many times the run was started: a task lost to a restart is
                  retried once, then the run fails with the reason.
                format: int32
                minimum: 0
                type: integer
              blindSpots:
                description: What the review could not read, with the reason.
                items:
                  description: NotSeen is a part of the ground a survey could not
                    read.
                  properties:
                    reason:
                      maxLength: 1024
                      minLength: 1
                      type: string
                    ref:
                      description: 'What was not read: a namespace, a connector, an
                        API group.'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - reason
                  - ref
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              degraded:
                description: |-
                  Set when the run went on without some of its sources (a connector
                  down): the output says so, the run is not failed for it.
                properties:
                  connectors:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  reason:
                    type: string
                type: object
              engine:
                description: |-
                  Which engine ran it. Free strings: the engine is not an API concept,
                  only something the operator records (ADR 0007).
                properties:
                  agent:
                    type: string
                  kind:
                    type: string
                  taskID:
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  RunPhase is where a run of an agent role stands. The shared phases are
                  below; each record kind validates its own set, which may add phases.
                type: string
              postMortem:
                description: The post-mortem draft, Practitioner only.
                maxLength: 16384
                type: string
              problem:
                description: Problem is what the incident was and whether it came
                  before.
                properties:
                  recurrences:
                    items:
                      description: Recurrence is an earlier incident with the same
                        cause.
                      properties:
                        date:
                          format: date-time
                          type: string
                        evidence:
                          items:
                            description: |-
                              Evidence is a tool call that backs a finding: the tool and the record it
                              read, never its output.
                            properties:
                              record:
                                maxLength: 253
                                type: string
                              tool:
                                maxLength: 253
                                minLength: 1
                                type: string
                            required:
                            - tool
                            type: object
                          maxItems: 10
                          type: array
                          x-kubernetes-list-type: atomic
                        record:
                          description: An investigation's name or a knowledge record's
                            id.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - record
                      type: object
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: atomic
                  statement:
                    description: |-
                      What the incident was and its root cause, as the Doc's diagnosis
                      states it.
                    maxLength: 4096
                    type: string
                type: object
              published:
                description: |-
                  The publication through the Kiné's report connector: unset while the
                  operator still has to publish, or says why nothing is published.
                properties:
                  connector:
                    type: string
                  destination:
                    type: string
                  ok:
                    type: boolean
                  reason:
                    type: string
                required:
                - ok
                type: object
              reason:
                description: |-
                  Why the run is in its phase: for Failed, TimedOut and Dropped, why it
                  ended; for Queued, why it waits (DocNotRunnable, WaitingForSlot).
                type: string
              startedAt:
                format: date-time
                type: string
              traceID:
                type: string
              usage:
                description: Usage is the model usage of one run.
                properties:
                  approximate:
                    description: |-
                      True when the usage could not be attributed to this run alone: runs
                      overlapped, or another role shares the model (spec 02 §5).
                    type: boolean
                  cachedInputTokens:
                    format: int64
                    type: integer
                  estimatedCost:
                    description: Estimated cost with its currency, for example "0.0093
                      USD".
                    type: string
                  inputTokens:
                    format: int64
                    type: integer
                  modelCalls:
                    format: int64
                    type: integer
                  outputTokens:
                    format: int64
                    type: integer
                required:
                - inputTokens
                - modelCalls
                - outputTokens
                type: object
            type: object
            x-kubernetes-validations:
            - message: phase must be Queued, Running, Completed, Failed or Dropped
              rule: '!has(self.phase) || self.phase in [''Queued'', ''Running'', ''Completed'',
                ''Failed'', ''Dropped'']'
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'a review''s name is at most 63 characters: it starts the ids of
            the actions it proposes'
          optionalOldSelf: true
          rule: oldSelf.hasValue() || size(self.metadata.name) <= 63
    served: true
    storage: true
    subresources:
      status: {}
