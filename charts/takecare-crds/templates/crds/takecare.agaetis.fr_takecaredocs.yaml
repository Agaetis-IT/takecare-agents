---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    helm.sh/resource-policy: keep
  name: takecaredocs.takecare.agaetis.fr
spec:
  group: takecare.agaetis.fr
  names:
    categories:
    - takecare
    kind: TakeCareDoc
    listKind: TakeCareDocList
    plural: takecaredocs
    shortNames:
    - tcdoc
    singular: takecaredoc
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.level
      name: Level
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'TakeCareDoc is the Doc: it diagnoses incidents, read-only.'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TakeCareDocSpec configures the Doc, the incident diagnosis role (spec 02).
              The namespaces rule goes when the intake routes by entity (ADR 0015 §4).
            properties:
              actTools:
                description: Act tools, Expert level only. Accepted and ignored in
                  milestone 1.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              alerts:
                description: AlertsSpec filters the alerts the Doc handles.
                properties:
                  matchers:
                    description: 'Alertmanager-style equality matchers. Default: every
                      alert in scope.'
                    items:
                      description: AlertMatcher matches one alert label.
                      properties:
                        name:
                          minLength: 1
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              connectors:
                description: |-
                  Connectors bound to the Doc, by type. The Doc is ready when its scope
                  is covered by the cluster connectors (a namespace nothing reads is a
                  blind spot); report is required from the Practitioner level, which the
                  controller reports (ConnectorMissing) rather than the schema rejecting it.
                properties:
                  changes:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  cluster:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  knowledge:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  map:
                    description: |-
                      The Map connector (type map, spec 08): one Map per scope. Its read
                      tools are given at every level, and it covers scope.entities.
                    items:
                      type: string
                    maxItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  metrics:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  report:
                    description: 'The report connector: where the operator publishes
                      diagnoses.'
                    type: string
                  tickets:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
              contentTools:
                description: |-
                  Tools classed content (their result carries payload: logs, object
                  contents, ConfigMap data) the role may use, at every level; a
                  content tool not listed here never enters the role's allow-list
                  (ADR 0014 §5). Not enforced yet.
                items:
                  minLength: 1
                  type: string
                maxItems: 50
                type: array
                x-kubernetes-list-type: set
              investigation:
                default: {}
                description: InvestigationSettings bounds how investigations run.
                properties:
                  cooldown:
                    default: 15m
                    description: Minimum time between two investigations of the same
                      alert fingerprint.
                    type: string
                  maxConcurrent:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                  timeout:
                    default: 300s
                    type: string
                type: object
              level:
                default: Apprentice
                description: Intervention level. Defaults to Apprentice.
                enum:
                - Apprentice
                - Practitioner
                - Expert
                type: string
              model:
                description: Overrides the model declared in the TakeCarePlatform.
                properties:
                  name:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              report:
                description: Destinations of the report connector, by level.
                properties:
                  apprentice:
                    description: 'Destination at the Apprentice level. Unset: diagnoses
                      stay in status.'
                    type: string
                  practitioner:
                    description: Destination at the Practitioner level.
                    type: string
                type: object
              scope:
                description: |-
                  What the role works on: namespaces, Map entries, or both. Each kind
                  says which selectors it accepts (spec 06 §1).
                properties:
                  entities:
                    description: |-
                      Map entries in scope, by key (spec 08); only validated entries
                      count. Routing by entity lands with ADR 0015's intake.
                    items:
                      description: |-
                        EntityKey is a Map entry's key, type/name, with one of spec 08's eleven
                        type prefixes.
                      maxLength: 253
                      pattern: ^(service|compute|datastore|storage|network|identity|external|team|environment|observability|runbook)/[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                    maxItems: 200
                    type: array
                    x-kubernetes-list-type: set
                  namespaces:
                    description: Namespaces the role may read (and, at the Expert
                      level, modify).
                    items:
                      description: Namespace is a Kubernetes namespace name.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
                x-kubernetes-validations:
                - message: 'scope needs at least one selector: namespaces or entities'
                  rule: (has(self.namespaces) && size(self.namespaces) > 0) || (has(self.entities)
                    && size(self.entities) > 0)
              suspend:
                description: 'Pause without deletion: the role stops handling anything.'
                type: boolean
            required:
            - scope
            type: object
            x-kubernetes-validations:
            - message: the Doc routes by namespace until the Map intake lands (ADR
                0015); scope.namespaces is required
              rule: has(self.scope.namespaces) && size(self.scope.namespaces) > 0
          status:
            description: TakeCareDocStatus is the observed state of the Doc.
            properties:
              blindSpots:
                description: |-
                  Entities of the scope the role cannot read, filled from coverage
                  (ADR 0014 §2); empty until coverage is computed.
                items:
                  description: BlindSpot is an entity of the scope the role cannot
                    read.
                  properties:
                    entity:
                      description: |-
                        EntityKey is a Map entry's key, type/name, with one of spec 08's eleven
                        type prefixes.
                      maxLength: 253
                      pattern: ^(service|compute|datastore|storage|network|identity|external|team|environment|observability|runbook)/[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                    message:
                      type: string
                    reason:
                      description: BlindSpotReason says why an entity is not covered.
                      enum:
                      - NoAccess
                      - ConnectorNotReady
                      type: string
                  required:
                  - entity
                  - reason
                  type: object
                maxItems: 200
                type: array
                x-kubernetes-list-map-keys:
                - entity
                x-kubernetes-list-type: map
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastInvestigation:
                type: string
              lastInvestigationTime:
                format: date-time
                type: string
              level:
                description: Effective level, which differs from spec.level when the
                  requested one is not supported.
                enum:
                - Apprentice
                - Practitioner
                - Expert
                type: string
              observedGeneration:
                format: int64
                type: integer
              renderPendingSince:
                description: |-
                  RenderPendingSince is set while a new rendering of the engine's agent
                  waits for a running investigation to end (a re-rendered agent restarts
                  and loses its task). The gateway's tool policies are never deferred.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
