# takecare-crds: CRDs of TakeCare and of its third-party building blocks.
#
# Helm never upgrades a chart's crds/ directory and deletes templated CRDs on
# uninstall. This chart renders every CRD as a template, so that `helm upgrade`
# updates them, and marks TakeCare's own CRDs `helm.sh/resource-policy: keep`,
# so that an uninstall of this chart leaves them (and every TakeCare resource)
# in place. The third-party charts below do not set that policy: uninstalling
# this chart removes their CRDs and every agentgateway and kagent resource
# with them. Do not uninstall it on a cluster that still runs TakeCare.

global:
  # -- Registry prefix for every image this chart pulls, for customer-internal
  # registries (ADR 0002). Empty: the registry of each image below.
  imageRegistry: ""
  imagePullSecrets: []

# -- The operator image runs the Gateway API hook job (gatewayAPI below).
image:
  registry: ghcr.io/agaetis-it
  repository: takecare-operator
  # Empty: the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# -- Upstream Gateway API CRDs, standard channel, applied server-side by a hook
# job (pre-install, pre-upgrade) from the copy embedded in the operator
# binary: no Internet access needed. Many clusters already have these CRDs
# (Istio, Cilium, Envoy Gateway), so the job compares bundle versions:
#   auto   : install the missing CRDs, keep the ones at the bundle's version
#            or newer, fail when some are older or of unknown origin
#   always : apply the bundle and take ownership of the CRDs, whatever is
#            there; on CRDs from the experimental channel this installs the
#            standard channel over them and removes the fields that channel
#            adds, which a gateway implementation on the cluster may rely on
#   never  : do nothing (the CRDs are managed outside TakeCare)
gatewayAPI:
  install: auto
  # -- Rights of the hook's ServiceAccount: create on CRDs cannot be narrowed by
  # name, get and patch are limited to the Gateway API CRDs.
  job:
    backoffLimit: 2
    activeDeadlineSeconds: 300
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 128Mi }

# -- agentgateway CRDs (agentgateway.dev), from the upstream chart.
agentgateway:
  enabled: true

# -- kagent CRDs (kagent.dev), from the upstream chart. kmcp is not used by
# TakeCare (every MCP server is a connector behind the gateway, ADR 0008).
kagent:
  enabled: true
kagent-crds:
  kmcp:
    enabled: false
  substrate:
    enabled: false

# -- Demo profile only: the ACK DBProxy CRD, a piece of scenery the Doc reads
# (spec 03). No ACK controller is installed.
demo:
  enabled: false
