{{- if .Values.networkPolicies.enabled }}
# Ingress: the front's mTLS port, from anywhere (the administration cluster
# is outside); nothing reaches the probe port or the server through the pod
# network (the kubelet's probes are exempt on the CNIs TakeCare targets).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "takecare-cluster.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "takecare-cluster.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
  # Egress: DNS, and the API server, bounded by its port (a NetworkPolicy
  # cannot name it).
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: {{ .Values.apiServer.port }}
{{- end }}
