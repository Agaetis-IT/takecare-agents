# Bindings of the operator's rights. The rules themselves are generated from
# the controllers' RBAC markers and copied into roles.yaml by `make
# chart-sync` (a drift fails CI): Roles in the operator namespace and in the
# engine namespace, a ClusterRole for the cluster-scoped TakeCarePlatform
# only. No cluster-wide right on Secrets, pods/exec or wildcards (spec 02
# section 3); test/chart checks it on the render.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: takecare-operator
  labels:
    {{- include "takecare.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: takecare-operator
subjects:
  - kind: ServiceAccount
    name: takecare-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: takecare-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: takecare-operator
subjects:
  - kind: ServiceAccount
    name: takecare-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: takecare-operator
  namespace: {{ .Values.platform.engine.namespace }}
  labels:
    {{- include "takecare.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: takecare-operator
subjects:
  - kind: ServiceAccount
    name: takecare-operator
    namespace: {{ .Release.Namespace }}
---
# Leader election and the metrics endpoint's own authentication.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: takecare-operator-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: takecare-operator-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: takecare-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: takecare-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: takecare-operator-metrics-auth
  labels:
    {{- include "takecare.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: takecare-operator-metrics-auth
  labels:
    {{- include "takecare.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: takecare-operator-metrics-auth
subjects:
  - kind: ServiceAccount
    name: takecare-operator
    namespace: {{ .Release.Namespace }}
