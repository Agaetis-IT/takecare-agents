# The Doc's trigger (spec 02 §1): the Alertmanager webhook served by every
# operator replica at POST /v1/alerts, behind a bearer token. By default the
# chart generates the token once and keeps it across upgrades (lookup). A
# lookup sees nothing under `helm template` or a GitOps render (Argo CD,
# Flux), where every sync would generate a new token and break Alertmanager's
# receiver: there, create the Secret yourself and set alerting.existingSecret.
{{- if not .Values.alerting.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "takecare-alerting" }}
apiVersion: v1
kind: Secret
metadata:
  name: takecare-alerting
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data $existing.data.token }}
  token: {{ $existing.data.token }}
  {{- else }}
  token: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: takecare-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "takecare.operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: alerts
      port: 8080
      targetPort: alerts
