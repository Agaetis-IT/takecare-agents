{{- /*
The chart is written for one namespace: the kagent subchart's values and the
default ModelConfig's gateway URL name takecare-system, and subchart values
cannot be templated from the release. Installing elsewhere would break
without a message, so it is refused here.
*/ -}}
{{- if ne .Release.Namespace "takecare-system" }}
{{- fail (printf "the takecare chart must be installed in the namespace takecare-system (got %q): the kagent values and the gateway URL it carries name that namespace" .Release.Namespace) }}
{{- end }}
