{{- if .Values.gateway.create }}
# The one Gateway every model, MCP and A2A call goes through (ADR 0004, 0008,
# 0009). The listener takes HTTPRoutes from any namespace, since the
# operator renders the engine's routes next to the engine.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.port }}
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
{{- end }}
