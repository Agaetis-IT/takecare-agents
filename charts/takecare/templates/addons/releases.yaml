{{- $a := .Values.addons.releases }}
{{- if $a.enabled }}
{{- $ctx := dict "root" . "name" "releases" "port" 8080 }}
{{- $image := printf "%s/%s:%s" (.Values.global.imageRegistry | default $a.image.registry) $a.image.repository ($a.image.tag | default .Chart.AppVersion) }}
{{- $ca := or .Values.global.caBundle.configMapName .Values.global.caBundle.secretName }}
{{- /* The configuration the server reads: where each token is mounted,
never the token. Volumes are named by index. */}}
{{- $sources := list }}
{{- range $i, $s := $a.sources }}
{{- $e := dict "name" $s.name "kind" $s.kind "url" $s.url "components" ($s.components | default list) }}
{{- with $s.authHost }}{{ $_ := set $e "authHost" . }}{{ end }}
{{- with $s.tokenSecretRef }}
{{- if .name }}
{{- $_ := set $e "tokenFile" (printf "/etc/takecare/releases/token-%d/token" $i) }}
{{- $_ := set $e "tokenSecret" .name }}
{{- with .username }}{{ $_ := set $e "username" . }}{{ end }}
{{- end }}
{{- end }}
{{- $sources = append $sources $e }}
{{- end }}
{{- $config := toPrettyJson (dict "cache" $a.cache "sources" $sources) }}
# Add-on releases: takecare-agents-mcp-releases (ours), three read tools
# over the versions and release cycles its sources publish (spec 12 §7.1),
# read by the Mécano's collector. It reads no Kubernetes object: its
# ServiceAccount has no Role and no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: takecare-addon-releases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: takecare-addon-releases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
data:
  config.json: |
    {{- $config | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: takecare-addon-releases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "takecare.addon.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "takecare.addon.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ $config | sha256sum }}
    spec:
      serviceAccountName: takecare-addon-releases
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ include "takecare.addon.image" (dict "image" $image "root" .) | quote }}
          imagePullPolicy: {{ $a.image.pullPolicy }}
          args:
            - --listen=:8080
            - --config-file=/etc/takecare/releases/config/config.json
          env:
            {{- with .Values.global.egressProxy }}
            {{- if .httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ .httpsProxy | quote }}
            {{- end }}
            {{- if .noProxy }}
            - name: NO_PROXY
              value: {{ .noProxy | quote }}
            {{- end }}
            {{- end }}
            {{- if $ca }}
            - name: SSL_CERT_FILE
              value: /etc/takecare/ca/{{ .Values.global.caBundle.key }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $a.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/takecare/releases/config
              readOnly: true
            {{- range $i, $s := $a.sources }}
            {{- if dig "tokenSecretRef" "name" "" $s }}
            - name: token-{{ $i }}
              mountPath: /etc/takecare/releases/token-{{ $i }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if $ca }}
            - name: ca-bundle
              mountPath: /etc/takecare/ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: takecare-addon-releases
        {{- range $i, $s := $a.sources }}
        {{- with $s.tokenSecretRef }}
        {{- if .name }}
        - name: token-{{ $i }}
          secret:
            secretName: {{ .name }}
            items:
              - key: {{ .key | default "token" }}
                path: token
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if $ca }}
        - name: ca-bundle
          {{- if .Values.global.caBundle.secretName }}
          secret:
            secretName: {{ .Values.global.caBundle.secretName }}
          {{- else }}
          configMap:
            name: {{ .Values.global.caBundle.configMapName }}
          {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: takecare-addon-releases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "takecare.addon.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if .Values.networkPolicies.enabled }}
---
{{ include "takecare.addon.ingressPolicy" $ctx }}
---
# Egress: DNS plus TCP 443 only, to egressCIDRs when set, else the declared
# proxy pods, else addresses outside the cluster, the private ranges
# excluded. A NetworkPolicy cannot name the sources' hosts: the server
# refuses any other host.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: takecare-addon-releases-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "takecare.addon.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if $a.egressCIDRs }}
    - to:
        {{- range $a.egressCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- else if $a.egress.proxy }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $a.egress.proxy.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $a.egress.proxy.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $a.egress.proxy.port }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $a.egress.excludedCIDRs | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
---
apiVersion: takecare.agaetis.fr/v1alpha1
kind: TakeCareConnector
metadata:
  name: releases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  types: [releases]
  description: "Published versions and release cycles, read by the Mécano's collector (read-only)"
  mcp:
    addon: releases
  {{- with include "takecare.addon.tools" (dict "contentTools" $a.contentTools "tools" $a.tools) | trim }}{{ . | nindent 2 }}{{ end }}
{{- end }}
