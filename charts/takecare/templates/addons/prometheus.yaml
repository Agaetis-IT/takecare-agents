{{- if .Values.addons.prometheus.enabled }}
{{- $a := .Values.addons.prometheus }}
{{- $ctx := dict "root" . "name" "prometheus" "port" 8080 }}
# Add-on prometheus: giantswarm/mcp-prometheus, read-only by design (spec 05).
# Every tool accepts a prometheus_url from the caller, so its egress is
# limited to the configured Prometheus, DNS and the collector: a URL the
# model chooses cannot reach another address (SSRF).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: takecare-addon-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: takecare-addon-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "takecare.addon.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "takecare.addon.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: takecare-addon-prometheus
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ include "takecare.addon.image" (dict "image" $a.image "root" .) | quote }}
          args:
            - serve
            - --transport=streamable-http
            - --http-addr=:8080
            - --http-endpoint=/mcp
            - --metrics-addr=:9091
            - --tenancy-mode=none
          env:
            - name: PROMETHEUS_URL
              value: {{ $a.url | quote }}
            {{- if .Values.platform.observability.otlp.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.platform.observability.otlp.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: takecare-addon-prometheus
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $a.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: takecare-addon-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "takecare.addon.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if .Values.networkPolicies.enabled }}
---
{{ include "takecare.addon.ingressPolicy" $ctx }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: takecare-addon-prometheus-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "takecare.addon.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Egress]
  egress:
    # The configured Prometheus only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $a.egress.namespace | default .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $a.egress.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $a.egress.port }}
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with $a.egress.otlp }}
    # The collector, for its own spans.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | default $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
{{- end }}
---
apiVersion: takecare.agaetis.fr/v1alpha1
kind: TakeCareConnector
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  types: [metrics]
  description: Prometheus metrics and alerts (read-only)
  mcp:
    addon: prometheus
  {{- with include "takecare.addon.tools" (dict "contentTools" $a.contentTools "tools" $a.tools) | trim }}{{ . | nindent 2 }}{{ end }}
{{- end }}
