{{- $a := .Values.addons.codePropose }}
{{- if $a.enabled }}
{{- $ctx := dict "root" . "name" "code-propose" "port" 8080 }}
{{- $image := printf "%s/%s:%s" (.Values.global.imageRegistry | default $a.image.registry) $a.image.repository ($a.image.tag | default .Chart.AppVersion) }}
{{- $ca := or .Values.global.caBundle.configMapName .Values.global.caBundle.secretName }}
{{- /* The repositories file the server reads: where each token is
mounted, never the token. Token files are named by index. */}}
{{- $repos := list }}
{{- range $i, $r := $a.repositories }}
{{- $repos = append $repos (dict "forge" $r.forge "apiURL" $r.apiURL "repository" $r.repository "tokenFile" (printf "/etc/takecare/propose/tokens/%d" $i)) }}
{{- end }}
{{- $config := toPrettyJson $repos }}
# Add-on code-propose: takecare-agents-mcp-code in propose mode (ours), the
# product's first write, outside Kubernetes (spec 12 §6). One tool,
# propose_change: a draft pull request on a listed repository. It alone
# holds the write tokens, mounted from one Secret on this pod only. It
# reads and writes no Kubernetes object: its ServiceAccount has no Role and
# no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: takecare-addon-code-propose
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: takecare-addon-code-propose
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
data:
  repositories.json: |
    {{- $config | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: takecare-addon-code-propose
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "takecare.addon.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "takecare.addon.labels" $ctx | nindent 8 }}
      annotations:
        checksum/repositories: {{ $config | sha256sum }}
    spec:
      serviceAccountName: takecare-addon-code-propose
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ include "takecare.addon.image" (dict "image" $image "root" .) | quote }}
          imagePullPolicy: {{ $a.image.pullPolicy }}
          args:
            - --mode=propose
            - --listen=:8080
            - --repositories-file=/etc/takecare/propose/config/repositories.json
            {{- if $ca }}
            - --ca-file=/etc/takecare/ca/{{ .Values.global.caBundle.key }}
            {{- end }}
          env:
            {{- with .Values.global.egressProxy }}
            {{- if .httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ .httpsProxy | quote }}
            {{- end }}
            {{- if .noProxy }}
            - name: NO_PROXY
              value: {{ .noProxy | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $a.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/takecare/propose/config
              readOnly: true
            - name: tokens
              mountPath: /etc/takecare/propose/tokens
              readOnly: true
            {{- if $ca }}
            - name: ca-bundle
              mountPath: /etc/takecare/ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: takecare-addon-code-propose
        - name: tokens
          secret:
            secretName: {{ $a.tokenSecret.name }}
            items:
              {{- range $i, $r := $a.repositories }}
              - key: {{ $r.tokenKey }}
                path: "{{ $i }}"
              {{- end }}
        {{- if $ca }}
        - name: ca-bundle
          {{- if .Values.global.caBundle.secretName }}
          secret:
            secretName: {{ .Values.global.caBundle.secretName }}
          {{- else }}
          configMap:
            name: {{ .Values.global.caBundle.configMapName }}
          {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: takecare-addon-code-propose
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "takecare.addon.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if .Values.networkPolicies.enabled }}
---
{{ include "takecare.addon.ingressPolicy" $ctx }}
---
# Egress: DNS plus TCP 443 to addresses outside the cluster, the private
# ranges excluded, or the declared proxy pods only. A NetworkPolicy cannot
# name the forges' hosts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: takecare-addon-code-propose-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "takecare.addon.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if $a.egress.proxy }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $a.egress.proxy.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $a.egress.proxy.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $a.egress.proxy.port }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $a.egress.excludedCIDRs | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
---
# The propose_change tool is annotated as a write that destroys nothing,
# which discovery classes act; this override makes it propose, shown in the
# connector's status.overrides with its warning event (spec 12 §6.4).
apiVersion: takecare.agaetis.fr/v1alpha1
kind: TakeCareConnector
metadata:
  name: code-propose
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  types: [code]
  description: "Draft pull requests on the customer's listed repositories (propose)"
  mcp:
    addon: code-propose
  tools:
    - name: propose_change
      class: propose
  propose:
    tokenSecretRef:
      name: {{ $a.tokenSecret.name }}
    repositories:
      {{- range $a.repositories }}
      - forge: {{ .forge }}
        apiURL: {{ .apiURL | quote }}
        repository: {{ .repository | quote }}
      {{- end }}
{{- end }}
