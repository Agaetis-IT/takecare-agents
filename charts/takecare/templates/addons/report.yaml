{{- $slack := .Values.addons.reportSlack }}
{{- $logm := .Values.addons.reportLog }}
{{- if or $slack.enabled $logm.enabled }}
{{- $mode := ternary "slack" "log" $slack.enabled }}
{{- $a := ternary $slack $logm $slack.enabled }}
{{- $name := ternary "report-slack" "report-log" $slack.enabled }}
{{- $ctx := dict "root" . "name" $name "port" 8080 }}
# Add-on {{ $name }}: takecare-agents-mcp-report-slack (ours), one tool,
# post_message, called by the operator alone to publish a diagnosis (spec 05,
# ADR 0008). Agents never reach it: no gateway backend, and its NetworkPolicy
# admits the operator only. In slack mode the token is mounted from a Secret
# and checked with auth.test (the pod's readiness); in log mode (demo only)
# the message is written to the server's log.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: takecare-addon-{{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
# The destinations the server may post to: the same values as the
# connector's, so that the server refuses anything the connector does not
# declare (defence in depth against a wrong call).
apiVersion: v1
kind: ConfigMap
metadata:
  name: takecare-addon-{{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
data:
  destinations.json: |
    {
    {{- $first := true }}
    {{- range $a.destinations }}
      {{- if not $first }},{{ end }}{{ $first = false }}
      {{ .name | quote }}: {{ .target | quote }}
    {{- end }}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: takecare-addon-{{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "takecare.addon.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "takecare.addon.labels" $ctx | nindent 8 }}
      annotations:
        checksum/destinations: {{ toYaml $a.destinations | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: takecare-addon-{{ $name }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ include "takecare.addon.image" (dict "image" (printf "%s/%s:%s" (.Values.global.imageRegistry | default .Values.addons.report.image.registry) .Values.addons.report.image.repository (.Values.addons.report.image.tag | default .Chart.AppVersion)) "root" .) | quote }}
          imagePullPolicy: {{ .Values.addons.report.image.pullPolicy }}
          args:
            - --mode={{ $mode }}
            - --listen=:8080
            {{- if $slack.enabled }}
            - --api-url={{ $slack.apiURL }}
            - --token-file=/etc/takecare/slack/{{ $slack.tokenSecret.key }}
            - --auth-interval={{ $slack.authInterval }}
            {{- end }}
            - --destinations-file=/etc/takecare/report/destinations.json
          env:
            {{- with .Values.global.egressProxy }}
            {{- if .httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ .httpsProxy | quote }}
            {{- end }}
            {{- if .noProxy }}
            - name: NO_PROXY
              value: {{ .noProxy | quote }}
            {{- end }}
            {{- end }}
            {{- if or .Values.global.caBundle.configMapName .Values.global.caBundle.secretName }}
            - name: SSL_CERT_FILE
              value: /etc/takecare/ca/{{ .Values.global.caBundle.key }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.addons.report.resources | nindent 12 }}
          volumeMounts:
            - name: destinations
              mountPath: /etc/takecare/report
              readOnly: true
            {{- if $slack.enabled }}
            - name: token
              mountPath: /etc/takecare/slack
              readOnly: true
            {{- end }}
            {{- if or .Values.global.caBundle.configMapName .Values.global.caBundle.secretName }}
            - name: ca-bundle
              mountPath: /etc/takecare/ca
              readOnly: true
            {{- end }}
      volumes:
        - name: destinations
          configMap:
            name: takecare-addon-{{ $name }}
        {{- if $slack.enabled }}
        - name: token
          secret:
            secretName: {{ $slack.tokenSecret.name }}
        {{- end }}
        {{- if or .Values.global.caBundle.configMapName .Values.global.caBundle.secretName }}
        - name: ca-bundle
          {{- if .Values.global.caBundle.secretName }}
          secret:
            secretName: {{ .Values.global.caBundle.secretName }}
          {{- else }}
          configMap:
            name: {{ .Values.global.caBundle.configMapName }}
          {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: takecare-addon-{{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "takecare.addon.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if .Values.networkPolicies.enabled }}
---
# The operator only: a report server is never reached by the gateway, so
# that no route could ever expose post_message to an agent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: takecare-addon-{{ $name }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "takecare.addon.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "takecare.operator.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
---
# Egress. A NetworkPolicy cannot name a host such as slack.com: in slack
# mode this is DNS plus TCP 443 to addresses outside the cluster (the
# private ranges excluded), or the declared proxy pods only when the egress
# goes through a proxy. Log mode needs no egress at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: takecare-addon-{{ $name }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "takecare.addon.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Egress]
  {{- if $slack.enabled }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if $slack.egress.proxy }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $slack.egress.proxy.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $slack.egress.proxy.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $slack.egress.proxy.port }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $slack.egress.excludedCIDRs | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
---
apiVersion: takecare.agaetis.fr/v1alpha1
kind: TakeCareConnector
metadata:
  name: report
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takecare.addon.labels" $ctx | nindent 4 }}
spec:
  types: [report]
  description: {{ ternary "Publishes diagnoses to Slack (chat.postMessage)" "Writes diagnoses to the report server's log (demo only)" $slack.enabled | quote }}
  mcp:
    addon: {{ $name }}
  report:
    adapter: {{ $mode }}
    destinations:
      {{- toYaml $a.destinations | nindent 6 }}
{{- end }}
