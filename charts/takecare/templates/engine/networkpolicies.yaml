{{- if and .Values.networkPolicies.enabled .Values.kagent.enabled }}
{{- $ns := .Values.kagent.namespaceOverride | default .Release.Namespace }}
# ADR 0007 installation requirement: the kagent controller is reachable only
# through the gateway. Its API authorizes nothing in any mode, so who can
# reach it is the whole security of the engine. Agent pods call the
# controller back (sessions, events) and the controller proxies A2A to them:
# that is the only other traffic admitted. The UI runs zero replicas.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: takecare-engine-default-deny
  namespace: {{ $ns }}
  labels:
    {{- include "takecare.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: takecare-engine-controller-ingress
  namespace: {{ $ns }}
  labels:
    {{- include "takecare.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/component: controller
  policyTypes: [Ingress]
  ingress:
    # The gateway's proxy pods (A2A to the agents, through the controller).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "takecare.gatewayNamespace" . }}
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: {{ include "takecare.gatewayName" . }}
      ports:
        - protocol: TCP
          port: 8083
    # The agent pods the controller creates.
    - from:
        - podSelector:
            matchLabels:
              app: kagent
      ports:
        - protocol: TCP
          port: 8083
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: takecare-engine-agents-ingress
  namespace: {{ $ns }}
  labels:
    {{- include "takecare.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: kagent
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kagent
              app.kubernetes.io/component: controller
{{- if .Values.kagent.database.postgres.bundled.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: takecare-engine-postgresql-ingress
  namespace: {{ $ns }}
  labels:
    {{- include "takecare.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/component: database
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kagent
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- end }}
