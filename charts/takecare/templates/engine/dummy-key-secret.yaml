{{- if .Values.kagent.enabled }}
# The engine's runtimes refuse to start without a provider key in their
# environment, and the gateway ignores whatever they send (ADR 0004): the
# operator points every engine ModelConfig at this Secret. The value is a
# deliberate placeholder, in clear on purpose; the real key exists only in
# the Secret the gateway reads, in the release namespace.
apiVersion: v1
kind: Secret
metadata:
  name: takecare-engine-dummy-key
  namespace: {{ .Values.kagent.namespaceOverride | default .Release.Namespace }}
  labels:
    {{- include "takecare.labels" . | nindent 4 }}
  annotations:
    takecare.agaetis.fr/placeholder: "not a credential: a fixed dummy value the engine's runtime requires; the provider key never leaves the gateway (ADR 0004)"
type: Opaque
stringData:
  apiKey: dummy
{{- end }}
