# values-prod.yaml: the production template of TakeCare Agents (ADR 0002).
#
# Copy it, set every value marked REQUIRED, and install in takecare-system:
#   helm install takecare-crds oci://ghcr.io/agaetis-it/charts/takecare-crds -n takecare-system --create-namespace
#   helm install takecare      oci://ghcr.io/agaetis-it/charts/takecare      -n takecare-system -f my-values.yaml
# Prerequisites that are yours (spec 01): the model provider and its key, a
# Prometheus that scrapes the gateway (usage and cost), an OTLP backend for
# traces, and the Secrets named below, created in takecare-system before
# the install. Everything else is installed by the charts.

global:
  imageRegistry: ""        # your mirror, when images are not pulled from ghcr.io
  imagePullSecrets: []
  egressProxy:
    httpsProxy: ""
    noProxy: ""
  caBundle:
    configMapName: ""      # your internal CA, when the provider or MCP servers use it
    key: ca.crt

operator:
  replicas: 2

platform:
  models:
    - name: default
      provider: openai-compatible
      baseURL: ""          # REQUIRED: your provider's OpenAI-compatible API, e.g. https://vllm.example.internal/v1
      model: ""            # REQUIRED: the model identifier the provider expects
      apiKeySecretRef:
        name: takecare-model   # REQUIRED: a Secret in takecare-system holding the provider key; the key never leaves the gateway
        key: apiKey
      pricing:             # decimal strings per million tokens, for the estimated cost
        inputPerMTok: "0"
        cachedInputPerMTok: "0"
        outputPerMTok: "0"
        currency: USD
  engine:
    namespace: kagent
  observability:
    metrics:
      prometheusURL: ""    # REQUIRED for usage and cost: a Prometheus that scrapes the gateway's proxy pods with the
                           # labels namespace and gateway_networking_k8s_io_gateway_name (agentgateway.monitoring.enabled
                           # renders a PodMonitor that does); the platform reports gateway-metrics-not-scraped otherwise
    otlp:
      endpoint: ""         # recommended: your OTLP endpoint, e.g. http://otel-collector.observability.svc:4317
      protocol: grpc
    captureContent: false  # keep off: prompts and answers may hold customer data (ADR 0006)
    samplingPerMille: 1000

networkPolicies:
  enabled: true            # keep on; requires a CNI that enforces NetworkPolicies
  metricsScrapers: []      # REQUIRED for usage and cost: your Prometheus pods, e.g. {namespace: monitoring, podSelector: {app.kubernetes.io/name: prometheus}}

addons:
  kubernetes:
    enabled: true
    namespaces: []         # REQUIRED: the namespaces the Doc may read (workloads, events, logs)
    extraResources: []     # custom resources the Doc must see; add {resource: configmaps} only if none holds credentials
    # contentTools: [pods_log, nodes_log]   # the default: log tools reach a role only when it lists them (ADR 0014)
  reportSlack:
    enabled: true
    tokenSecret:
      name: takecare-slack # REQUIRED: a Secret in takecare-system holding the bot token (chat:write scope), key below
      key: token
    destinations: []       # REQUIRED: e.g. [{name: on-call, target: C0123456789}, {name: review, target: C0987654321}]; channel IDs, not names
    egress:
      proxy: null          # set when Slack is reached through a proxy: {namespace, podSelector, port}; otherwise DNS + 443 to the outside
  reportLog:
    enabled: false         # demo only: writes diagnoses to the server's log, which would reach your log aggregation
  map:
    enabled: true
    git:
      url: ""              # REQUIRED: the repository holding your Map (spec 08), https://... or ssh://git@...
      ref: main
      credentialSecret: { name: "", key: token }          # an HTTPS token in a Secret of takecare-system, read-only on the repository...
      sshKeySecret: { name: "", key: id_ed25519 }         # ...or a deploy key, with the Git host's known_hosts below
      knownHostsConfigMap: { name: "", key: known_hosts }
    egress:
      proxy: null          # set when Git is reached through a proxy: {namespace, podSelector, port}; otherwise DNS + 443 (and 22 for SSH)
  prometheus:
    enabled: true
    url: ""                # REQUIRED: your Prometheus, e.g. http://prometheus-server.monitoring.svc
    egress:
      namespace: ""        # REQUIRED: where it runs, and the labels of its pods
      podSelector: {}
      port: 9090

agentgateway:
  enabled: true            # false to use your own agentgateway: its Gateway must then live in takecare-system
                           # (platform.gateway.gatewayRef), next to the provider key Secret; the operator never
                           # copies that Secret to another namespace
  monitoring:
    enabled: false         # true when Prometheus Operator is installed: a PodMonitor scrapes the gateway

kagent:
  enabled: true            # false to use your own kagent: it must then run in platform.engine.namespace and
                           # hold the Secret takecare-engine-dummy-key (key apiKey, value "dummy") the chart
                           # renders there when enabled; the operator only references it
  rbac:
    namespaces: [kagent]   # the engine's namespace only, never the release namespace where the provider key lives
  controller:
    auth:
      mode: unsecure       # see values.yaml before switching to trusted-proxy
    env: []
  database:
    postgres:
      # kagent's bundled PostgreSQL is documented as dev and evaluation only.
      bundled:
        enabled: false
      url: ""              # REQUIRED: postgres://user:password@host:5432/kagent?sslmode=require (or urlFile, mounted from a Secret)
  otel:
    tracing:
      enabled: true
      exporter:
        otlp:
          endpoint: ""     # REQUIRED when platform.observability.otlp.endpoint is set: the same endpoint, for the engine's spans
          protocol: grpc
          insecure: true

demo:
  enabled: false
