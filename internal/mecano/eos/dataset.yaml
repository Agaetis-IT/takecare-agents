#
# The end-of-support dataset (spec 12 §7.2), embedded in the operator and
# reviewed with each release. Every entry names its source page; nothing is
# guessed: a line whose end of support the source does not give has no
# supportEnds.
#
# Sources and licences (credited in NOTICE):
# - Kubernetes minors: kubernetes.io "Releases" (https://kubernetes.io/releases/),
#   from its data files data/releases/schedule.yaml and eol.yaml; removed
#   apiVersions: kubernetes.io "Deprecated API Migration Guide". The
#   Kubernetes documentation is CC BY 4.0.
# - cert-manager, Argo CD and Flux release cycles: endoflife.date API v1
#   (https://endoflife.date/api/v1/products/<product>), MIT.
# - agentgateway and kagent: the latest release of their GitHub releases
#   page only; neither publishes an end of support, so none is given.
#   Their match.images are the images the charts pinned in hack/versions.env
#   render: agentgateway's controller and the proxy image it deploys
#   (AGW_PROXY_IMAGE_*), kagent's controller and ui, and the agents' app and
#   golang-adk images (IMAGE_* and GO_IMAGE_* of its controller's config).
#
# To update: change date, then each entry from its source, and run the
# package's tests (go test ./internal/mecano/eos/).

date: "2026-11-27"

kubernetes:
  source: https://kubernetes.io/releases/
  # The newest minors first. latest is the newest patch released on that
  # minor; endOfLife is the page's "End of Life" date.
  minors:
    - {minor: "1.37", latest: "1.37.2", endOfLife: "2027-10-28"}
    - {minor: "1.36", latest: "1.36.6", endOfLife: "2027-06-28"}
    - {minor: "1.35", latest: "1.35.10", endOfLife: "2027-02-28"}
    - {minor: "1.34", latest: "1.34.13", endOfLife: "2026-10-27"}
    - {minor: "1.33", latest: "1.33.13", endOfLife: "2026-06-28"}
    - {minor: "1.32", latest: "1.32.13", endOfLife: "2026-02-28"}
    - {minor: "1.31", latest: "1.31.14", endOfLife: "2025-11-11"}
    - {minor: "1.30", latest: "1.30.14", endOfLife: "2025-07-15"}
    - {minor: "1.29", latest: "1.29.14", endOfLife: "2025-02-28"}
    - {minor: "1.28", latest: "1.28.15", endOfLife: "2024-10-22"}
  removedAPIs:
    source: https://kubernetes.io/docs/reference/using-api/deprecation-guide/
    # removedIn is the minor that stops serving the apiVersion; replacement
    # is the guide's; namespaced says whether the kind is namespaced.
    entries:
      - {apiVersion: flowcontrol.apiserver.k8s.io/v1beta3, kind: FlowSchema, removedIn: "1.32", replacement: flowcontrol.apiserver.k8s.io/v1}
      - {apiVersion: flowcontrol.apiserver.k8s.io/v1beta3, kind: PriorityLevelConfiguration, removedIn: "1.32", replacement: flowcontrol.apiserver.k8s.io/v1}
      - {apiVersion: flowcontrol.apiserver.k8s.io/v1beta2, kind: FlowSchema, removedIn: "1.29", replacement: flowcontrol.apiserver.k8s.io/v1}
      - {apiVersion: flowcontrol.apiserver.k8s.io/v1beta2, kind: PriorityLevelConfiguration, removedIn: "1.29", replacement: flowcontrol.apiserver.k8s.io/v1}
      - {apiVersion: storage.k8s.io/v1beta1, kind: CSIStorageCapacity, removedIn: "1.27", replacement: storage.k8s.io/v1, namespaced: true}
      - {apiVersion: flowcontrol.apiserver.k8s.io/v1beta1, kind: FlowSchema, removedIn: "1.26", replacement: flowcontrol.apiserver.k8s.io/v1beta2}
      - {apiVersion: flowcontrol.apiserver.k8s.io/v1beta1, kind: PriorityLevelConfiguration, removedIn: "1.26", replacement: flowcontrol.apiserver.k8s.io/v1beta2}
      - {apiVersion: autoscaling/v2beta2, kind: HorizontalPodAutoscaler, removedIn: "1.26", replacement: autoscaling/v2, namespaced: true}
      - {apiVersion: batch/v1beta1, kind: CronJob, removedIn: "1.25", replacement: batch/v1, namespaced: true}
      - {apiVersion: discovery.k8s.io/v1beta1, kind: EndpointSlice, removedIn: "1.25", replacement: discovery.k8s.io/v1, namespaced: true}
      - {apiVersion: events.k8s.io/v1beta1, kind: Event, removedIn: "1.25", replacement: events.k8s.io/v1, namespaced: true}
      - {apiVersion: autoscaling/v2beta1, kind: HorizontalPodAutoscaler, removedIn: "1.25", replacement: autoscaling/v2, namespaced: true}
      - {apiVersion: policy/v1beta1, kind: PodDisruptionBudget, removedIn: "1.25", replacement: policy/v1, namespaced: true}
      # Replaced by Pod Security Admission, not by another apiVersion.
      - {apiVersion: policy/v1beta1, kind: PodSecurityPolicy, removedIn: "1.25"}
      - {apiVersion: node.k8s.io/v1beta1, kind: RuntimeClass, removedIn: "1.25", replacement: node.k8s.io/v1}
      - {apiVersion: admissionregistration.k8s.io/v1beta1, kind: MutatingWebhookConfiguration, removedIn: "1.22", replacement: admissionregistration.k8s.io/v1}
      - {apiVersion: admissionregistration.k8s.io/v1beta1, kind: ValidatingWebhookConfiguration, removedIn: "1.22", replacement: admissionregistration.k8s.io/v1}
      - {apiVersion: apiextensions.k8s.io/v1beta1, kind: CustomResourceDefinition, removedIn: "1.22", replacement: apiextensions.k8s.io/v1}
      - {apiVersion: apiregistration.k8s.io/v1beta1, kind: APIService, removedIn: "1.22", replacement: apiregistration.k8s.io/v1}
      - {apiVersion: certificates.k8s.io/v1beta1, kind: CertificateSigningRequest, removedIn: "1.22", replacement: certificates.k8s.io/v1}
      - {apiVersion: coordination.k8s.io/v1beta1, kind: Lease, removedIn: "1.22", replacement: coordination.k8s.io/v1, namespaced: true}
      - {apiVersion: extensions/v1beta1, kind: Ingress, removedIn: "1.22", replacement: networking.k8s.io/v1, namespaced: true}
      - {apiVersion: networking.k8s.io/v1beta1, kind: Ingress, removedIn: "1.22", replacement: networking.k8s.io/v1, namespaced: true}
      - {apiVersion: networking.k8s.io/v1beta1, kind: IngressClass, removedIn: "1.22", replacement: networking.k8s.io/v1}
      - {apiVersion: rbac.authorization.k8s.io/v1beta1, kind: ClusterRole, removedIn: "1.22", replacement: rbac.authorization.k8s.io/v1}
      - {apiVersion: rbac.authorization.k8s.io/v1beta1, kind: ClusterRoleBinding, removedIn: "1.22", replacement: rbac.authorization.k8s.io/v1}
      - {apiVersion: rbac.authorization.k8s.io/v1beta1, kind: Role, removedIn: "1.22", replacement: rbac.authorization.k8s.io/v1, namespaced: true}
      - {apiVersion: rbac.authorization.k8s.io/v1beta1, kind: RoleBinding, removedIn: "1.22", replacement: rbac.authorization.k8s.io/v1, namespaced: true}
      - {apiVersion: scheduling.k8s.io/v1beta1, kind: PriorityClass, removedIn: "1.22", replacement: scheduling.k8s.io/v1}
      - {apiVersion: storage.k8s.io/v1beta1, kind: CSIDriver, removedIn: "1.22", replacement: storage.k8s.io/v1}
      - {apiVersion: storage.k8s.io/v1beta1, kind: CSINode, removedIn: "1.22", replacement: storage.k8s.io/v1}
      - {apiVersion: storage.k8s.io/v1beta1, kind: StorageClass, removedIn: "1.22", replacement: storage.k8s.io/v1}
      - {apiVersion: storage.k8s.io/v1beta1, kind: VolumeAttachment, removedIn: "1.22", replacement: storage.k8s.io/v1}
      - {apiVersion: extensions/v1beta1, kind: NetworkPolicy, removedIn: "1.16", replacement: networking.k8s.io/v1, namespaced: true}
      - {apiVersion: extensions/v1beta1, kind: DaemonSet, removedIn: "1.16", replacement: apps/v1, namespaced: true}
      - {apiVersion: apps/v1beta2, kind: DaemonSet, removedIn: "1.16", replacement: apps/v1, namespaced: true}
      - {apiVersion: extensions/v1beta1, kind: Deployment, removedIn: "1.16", replacement: apps/v1, namespaced: true}
      - {apiVersion: apps/v1beta1, kind: Deployment, removedIn: "1.16", replacement: apps/v1, namespaced: true}
      - {apiVersion: apps/v1beta2, kind: Deployment, removedIn: "1.16", replacement: apps/v1, namespaced: true}
      - {apiVersion: apps/v1beta1, kind: StatefulSet, removedIn: "1.16", replacement: apps/v1, namespaced: true}
      - {apiVersion: apps/v1beta2, kind: StatefulSet, removedIn: "1.16", replacement: apps/v1, namespaced: true}
      - {apiVersion: extensions/v1beta1, kind: ReplicaSet, removedIn: "1.16", replacement: apps/v1, namespaced: true}
      - {apiVersion: apps/v1beta1, kind: ReplicaSet, removedIn: "1.16", replacement: apps/v1, namespaced: true}
      - {apiVersion: apps/v1beta2, kind: ReplicaSet, removedIn: "1.16", replacement: apps/v1, namespaced: true}
      - {apiVersion: extensions/v1beta1, kind: PodSecurityPolicy, removedIn: "1.16", replacement: policy/v1beta1}

# Components TakeCare ships or reads. A running component is matched by
# image repository (registry host included), by chart name when the chart's
# version is the product's, or by its app.kubernetes.io/part-of label, whose
# version is then app.kubernetes.io/version. latest is the newest version
# the source gives; lines are the release cycles, newest first.
components:
  - name: cert-manager
    source: https://endoflife.date/cert-manager
    match:
      images:
        - quay.io/jetstack/cert-manager-controller
        - quay.io/jetstack/cert-manager-webhook
        - quay.io/jetstack/cert-manager-cainjector
      charts: [cert-manager]
    latest: "1.21.3"
    lines:
      - {line: "1.21", latest: "1.21.3"}
      - {line: "1.20", latest: "1.20.5"}
      - {line: "1.19", latest: "1.19.6", supportEnds: "2026-07-08"}
      - {line: "1.18", latest: "1.18.6", supportEnds: "2026-03-10"}
      - {line: "1.17", latest: "1.17.4", supportEnds: "2025-10-07"}
      - {line: "1.16", latest: "1.16.5", supportEnds: "2025-06-10"}
      - {line: "1.15", latest: "1.15.5", supportEnds: "2025-02-03"}
  - name: argo-cd
    source: https://endoflife.date/argo-cd
    match:
      images: [quay.io/argoproj/argocd]
    latest: "3.6.3"
    lines:
      - {line: "3.6", latest: "3.6.3"}
      - {line: "3.5", latest: "3.5.9"}
      - {line: "3.4", latest: "3.4.15"}
      - {line: "3.3", latest: "3.3.19", supportEnds: "2026-11-04"}
      - {line: "3.2", latest: "3.2.12", supportEnds: "2026-08-04"}
      - {line: "3.1", latest: "3.1.16", supportEnds: "2026-05-05"}
      - {line: "3.0", latest: "3.0.23", supportEnds: "2026-02-02"}
      - {line: "2.14", latest: "2.14.21", supportEnds: "2025-11-04"}
  - name: flux
    source: https://endoflife.date/flux
    match:
      partOf: flux
    latest: "2.10.1"
    lines:
      - {line: "2.10", latest: "2.10.1"}
      - {line: "2.9", latest: "2.9.6"}
      - {line: "2.8", latest: "2.8.8"}
      - {line: "2.7", latest: "2.7.5", supportEnds: "2026-10-26"}
      - {line: "2.6", latest: "2.6.4", supportEnds: "2026-06-30"}
      - {line: "2.5", latest: "2.5.1", supportEnds: "2026-02-24"}
      - {line: "2.4", latest: "2.4.0", supportEnds: "2025-09-30"}
  - name: agentgateway
    source: https://github.com/agentgateway/agentgateway/releases/tag/v1.7.0
    match:
      images: [cr.agentgateway.dev/agentgateway, cr.agentgateway.dev/controller]
      charts: [agentgateway]
    latest: "1.7.0"
  - name: kagent
    source: https://github.com/kagent-dev/kagent/releases/tag/v1.0.1
    match:
      images: [ghcr.io/kagent-dev/kagent/controller, ghcr.io/kagent-dev/kagent/ui, ghcr.io/kagent-dev/kagent/app, ghcr.io/kagent-dev/kagent/golang-adk]
      charts: [kagent]
    latest: "1.0.1"
