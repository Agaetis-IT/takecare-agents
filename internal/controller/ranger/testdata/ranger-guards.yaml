markers:
- action: Reject
  level: Practitioner
  name: filtering
  policy: ranger-guards
  target: Gateway/agentgateway-proxy
- action: Mask
  level: Practitioner
  name: masking
  policy: ranger-guards
  target: Gateway/agentgateway-proxy
spec:
  backend:
    ai:
      promptGuard:
        request:
        - regex:
            action: Reject
            matches:
            - '-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'
            - \bAKIA[0-9A-Z]{16}\b
            - \b(?:ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,})\b
            - \bxox[abp]-[A-Za-z0-9-]{10,}
            - \bAIza[0-9A-Za-z_-]{35}\b
            - (?i)api[_-]?key\s*[:=]\s*\S{16,}
            - itk_[A-Za-z0-9]{32}
          response:
            message: 'rejected by the Ranger: a secret shape in the request'
        - regex:
            action: Mask
            builtins:
            - CreditCard
            - Email
            matches:
            - '[A-Z]{2}\d{2}[A-Z0-9]{11,30}'
        response:
        - regex:
            action: Mask
            builtins:
            - CreditCard
            - Email
            matches:
            - '[A-Z]{2}\d{2}[A-Z0-9]{11,30}'
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-proxy
