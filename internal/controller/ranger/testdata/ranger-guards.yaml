markers:
- action: Mask
  level: Practitioner
  name: secret-masking
  policy: ranger-guards
  target: Gateway/agentgateway-proxy
- action: Mask
  level: Practitioner
  name: masking
  policy: ranger-guards
  target: Gateway/agentgateway-proxy
- action: Reject
  level: Practitioner
  name: filtering
  policy: ranger-guards
  target: Gateway/agentgateway-proxy
spec:
  backend:
    ai:
      promptGuard:
        request:
        - regex:
            action: Mask
            matches:
            - (?s)-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----.*?-----END
              (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----
            - \bAKIA[0-9A-Z]{16}\b
            - \b(?:ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,})\b
            - \bxox[abp]-[A-Za-z0-9-]{10,}
            - \bAIza[0-9A-Za-z_-]{35}\b
            - (?i)api[_-]?key\s*[:=]\s*\S{16,}
          scope:
          - ToolOutput
        - regex:
            action: Mask
            builtins:
            - CreditCard
            - Email
            matches:
            - '\+[1-9][0-9]{0,2}(?:[ .-]?\(0\))?[ .-]?(?:[0-9](?: ?[0-9]){8,10}|[0-9](?:\.?[0-9]){8,10}|[0-9](?:-?[0-9]){8,10})\b'
            - (?:(?m:^)|[^0-9A-Za-z_.])00[1-9](?:[ .]?[0-9]){10,13}\b
            - '\b0[1-9](?: [0-9]{2}){4}\b|\b0[1-9](?:\.[0-9]{2}){4}\b|\b0[1-9](?:-[0-9]{2}){4}\b|(?:(?m:^)|[^0-9A-Za-z_.])0[1-9][0-9]{8}\b'
            - \(?\b[2-9][0-9]{2}\)? [2-9][0-9]{2}-[0-9]{4}\b|\b[2-9][0-9]{2}-[2-9][0-9]{2}-[0-9]{4}\b|\b[2-9][0-9]{2}\.[2-9][0-9]{2}\.[0-9]{4}\b
            - \b(?:00[1-9]|0[1-9][0-9]|[1-578][0-9]{2}|6[0-57-9][0-9]|66[0-57-9])-(?:0[1-9]|[1-9][0-9])-(?:000[1-9]|00[1-9][0-9]|0[1-9][0-9]{2}|[1-9][0-9]{3})\b
            - \b[12] [0-9]{2} (?:0[1-9]|1[0-2]|[23][0-9]|4[0-2]|[5-9][0-9]) (?:0[1-9]|[1-9][0-9]|2[AB])
              [0-9]{3} [0-9]{3} (?:0[1-9]|[1-8][0-9]|9[0-7])\b|(?:(?m:^)|[^0-9A-Za-z_.])[12][0-9]{2}(?:0[1-9]|1[0-2]|[23][0-9]|4[0-2]|[5-9][0-9])(?:0[1-9]|[1-9][0-9]|2[AB])[0-9]{6}(?:0[1-9]|[1-8][0-9]|9[0-7])\b
            - '[A-Z]{2}\d{2}[A-Z0-9]{11,30}'
          scope:
          - SystemPrompt
          - Messages
          - ToolOutput
        - regex:
            action: Reject
            matches:
            - '-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'
            - \bAKIA[0-9A-Z]{16}\b
            - \b(?:ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,})\b
            - \bxox[abp]-[A-Za-z0-9-]{10,}
            - \bAIza[0-9A-Za-z_-]{35}\b
            - (?i)api[_-]?key\s*[:=]\s*\S{16,}
            - itk_[A-Za-z0-9]{32}
          response:
            message: 'rejected by the Ranger: a secret shape in the request'
          scope:
          - SystemPrompt
          - Messages
          - ToolOutput
        response:
        - regex:
            action: Mask
            builtins:
            - CreditCard
            - Email
            matches:
            - '\+[1-9][0-9]{0,2}(?:[ .-]?\(0\))?[ .-]?(?:[0-9](?: ?[0-9]){8,10}|[0-9](?:\.?[0-9]){8,10}|[0-9](?:-?[0-9]){8,10})\b'
            - (?:(?m:^)|[^0-9A-Za-z_.])00[1-9](?:[ .]?[0-9]){10,13}\b
            - '\b0[1-9](?: [0-9]{2}){4}\b|\b0[1-9](?:\.[0-9]{2}){4}\b|\b0[1-9](?:-[0-9]{2}){4}\b|(?:(?m:^)|[^0-9A-Za-z_.])0[1-9][0-9]{8}\b'
            - \(?\b[2-9][0-9]{2}\)? [2-9][0-9]{2}-[0-9]{4}\b|\b[2-9][0-9]{2}-[2-9][0-9]{2}-[0-9]{4}\b|\b[2-9][0-9]{2}\.[2-9][0-9]{2}\.[0-9]{4}\b
            - \b(?:00[1-9]|0[1-9][0-9]|[1-578][0-9]{2}|6[0-57-9][0-9]|66[0-57-9])-(?:0[1-9]|[1-9][0-9])-(?:000[1-9]|00[1-9][0-9]|0[1-9][0-9]{2}|[1-9][0-9]{3})\b
            - \b[12] [0-9]{2} (?:0[1-9]|1[0-2]|[23][0-9]|4[0-2]|[5-9][0-9]) (?:0[1-9]|[1-9][0-9]|2[AB])
              [0-9]{3} [0-9]{3} (?:0[1-9]|[1-8][0-9]|9[0-7])\b|(?:(?m:^)|[^0-9A-Za-z_.])[12][0-9]{2}(?:0[1-9]|1[0-2]|[23][0-9]|4[0-2]|[5-9][0-9])(?:0[1-9]|[1-9][0-9]|2[AB])[0-9]{6}(?:0[1-9]|[1-8][0-9]|9[0-7])\b
            - '[A-Z]{2}\d{2}[A-Z0-9]{11,30}'
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-proxy
