markers:
- action: Require
  level: Expert
  name: source-networks
  policy: ranger-extra
  target: Gateway/agentgateway-proxy
- action: Require
  level: Expert
  name: expressions
  policy: ranger-extra
  target: Gateway/agentgateway-proxy
spec:
  frontend:
    networkAuthorization:
      action: Require
      policy:
        matchExpressions:
        - cidr("10.0.0.0/8").containsIP(source.address) || cidr("192.168.1.0/24").containsIP(source.address)
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-proxy
  traffic:
    authorization:
      action: Require
      policy:
        matchExpressions:
        - request.headers["x-team"] != ""
