markers:
- action: Log
  level: Practitioner
  name: journal
  policy: ranger-journal
  target: Gateway/agentgateway-proxy
spec:
  frontend:
    accessLog:
      attributes:
        add:
        - expression: '"ranger"'
          name: takecare.journal
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-proxy
