---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: takecare-operator
rules:
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - takecare.agaetis.fr
  resources:
  - takecareplatforms
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - takecare.agaetis.fr
  resources:
  - takecareplatforms/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: takecare-operator
  namespace: kagent
rules:
- apiGroups:
  - ""
  resourceNames:
  - takecare-engine-dummy-key
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - kagent.dev
  resources:
  - modelconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: takecare-operator
  namespace: takecare-system
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agentgateway.dev
  resources:
  - agentgatewaybackends
  - agentgatewaymodels
  - agentgatewaypolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resourceNames:
  - takecare-operator
  resources:
  - deployments
  verbs:
  - get
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gateways
  verbs:
  - get
  - list
  - watch
