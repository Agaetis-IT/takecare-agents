---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    helm.sh/resource-policy: keep
  name: takecaremecanos.takecare.agaetis.fr
spec:
  group: takecare.agaetis.fr
  names:
    categories:
    - takecare
    kind: TakeCareMecano
    listKind: TakeCareMecanoList
    plural: takecaremecanos
    shortNames:
    - tcmecano
    singular: takecaremecano
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.level
      name: Level
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastMaintenance
      name: Last maintenance
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TakeCareMecano is the Mécano: it keeps the fleet's parts in service,
          versions, end of support and planned upgrades, read-only on clusters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TakeCareMecanoSpec configures the Mécano, the lifecycle management role
              (spec 12): it compares what runs live with what Git declares and with
              what exists, and at Practitioner opens its upgrade plan as a draft pull
              request.
            properties:
              connectors:
                description: |-
                  Connectors bound to the Mécano, by slot. The cluster and code
                  connectors are required: without both, live and Git cannot be
                  compared.
                properties:
                  changes:
                    description: What was deployed.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  cluster:
                    description: What runs live.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  code:
                    description: What Git declares.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  copy:
                    description: |-
                      A read-only cluster connector on the team's own copy (staging),
                      read after the team applied a plan.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  history:
                    description: The Kiné's reviews.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  knowledge:
                    description: Release notes and the customer's end-of-support dates.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  map:
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  propose:
                    description: |-
                      The connector whose propose tool opens the plan's pull request;
                      Practitioner only.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  releases:
                    description: |-
                      The version watch: what exists upstream or in the customer's
                      mirror. Read by the collector only, never given to the agent.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 4
                    type: array
                    x-kubernetes-list-type: set
                  report:
                    description: 'The report connector: where the operator publishes
                      the maintenances.'
                    maxLength: 253
                    type: string
                type: object
                x-kubernetes-validations:
                - message: the Mécano needs at least one cluster connector
                  rule: has(self.cluster) && size(self.cluster) > 0
                - message: the Mécano needs at least one code connector
                  rule: has(self.code) && size(self.code) > 0
              contentTools:
                description: |-
                  Tools classed content (their result carries payload: logs, object
                  contents, ConfigMap data) the role may use, at every level; a
                  content tool not listed here never enters the role's allow-list
                  (ADR 0014 §5). Not enforced yet.
                items:
                  minLength: 1
                  type: string
                maxItems: 50
                type: array
                x-kubernetes-list-type: set
              level:
                default: Apprentice
                description: Intervention level. Defaults to Apprentice.
                enum:
                - Apprentice
                - Practitioner
                - Expert
                type: string
              maintenance:
                default: {}
                description: MecanoMaintenanceSettings sets the Mécano's maintenances.
                properties:
                  certificateWarning:
                    default: 720h
                    description: How long before a certificate's notAfter it is reported.
                    type: string
                  repositories:
                    description: |-
                      The repositories the plan may target, each one the propose
                      connector lists. Empty: the plan is never opened as a pull request.
                    items:
                      description: |-
                        MaintenanceRepository is a repository a plan may target, through the
                        propose connector that lists it.
                      properties:
                        connector:
                          maxLength: 253
                          minLength: 1
                          type: string
                        repository:
                          description: owner/name on GitHub, the project's full path
                            on GitLab.
                          maxLength: 255
                          minLength: 1
                          type: string
                      required:
                      - connector
                      - repository
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - connector
                    - repository
                    x-kubernetes-list-type: map
                  timeout:
                    default: 15m
                    description: The run's deadline, counted from its start.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: maintenance.timeout must be positive
                  rule: '!has(self.timeout) || duration(self.timeout) > duration(''0s'')'
                - message: maintenance.certificateWarning must be positive
                  rule: '!has(self.certificateWarning) || duration(self.certificateWarning)
                    > duration(''0s'')'
              model:
                description: Overrides the model declared in the TakeCarePlatform.
                properties:
                  name:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              report:
                description: Destinations of the report connector, by level.
                properties:
                  apprentice:
                    description: 'Destination at the Apprentice level. Unset: diagnoses
                      stay in status.'
                    type: string
                  practitioner:
                    description: Destination at the Practitioner level.
                    type: string
                type: object
              schedule:
                default: 0 5 * * 1
                description: |-
                  When the weekly maintenance runs, as a cron expression in UTC, or
                  "none" for no scheduled maintenance (maintenances on demand go on).
                  The controller parses it; a schedule it cannot parse is reported in
                  status.
                maxLength: 100
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: 'the schedule is in UTC: TZ= and CRON_TZ= are refused'
                  rule: '!self.contains(''TZ='')'
                - message: no scheduled maintenance is written 'none', in lower case
                  rule: self == 'none' || self.trim().lowerAscii() != 'none'
              scope:
                description: |-
                  What the role works on: namespaces, Map entries, or both. Each kind
                  says which selectors it accepts (spec 06 §1).
                properties:
                  entities:
                    description: |-
                      Map entries in scope, by key (spec 08); only validated entries
                      count. Routing by entity lands with ADR 0015's intake.
                    items:
                      description: |-
                        EntityKey is a Map entry's key, type/name, with one of spec 08's eleven
                        type prefixes.
                      maxLength: 253
                      pattern: ^(service|compute|datastore|storage|network|identity|external|team|environment|observability|runbook)/[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                    maxItems: 200
                    type: array
                    x-kubernetes-list-type: set
                  namespaces:
                    description: Namespaces the role may read (and, at the Expert
                      level, modify).
                    items:
                      description: Namespace is a Kubernetes namespace name.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
                x-kubernetes-validations:
                - message: 'scope needs at least one selector: namespaces or entities'
                  rule: (has(self.namespaces) && size(self.namespaces) > 0) || (has(self.entities)
                    && size(self.entities) > 0)
              suspend:
                description: 'Pause without deletion: the role stops handling anything.'
                type: boolean
            required:
            - connectors
            - scope
            type: object
            x-kubernetes-validations:
            - message: each maintenance repository names the propose connector
              rule: '!has(self.maintenance.repositories) || size(self.maintenance.repositories)
                == 0 || (has(self.connectors.propose) && self.maintenance.repositories.all(r,
                r.connector in self.connectors.propose))'
          status:
            description: TakeCareMecanoStatus is the observed state of the Mécano.
            properties:
              blindSpots:
                description: |-
                  Entities of the scope the role cannot read, filled from coverage
                  (ADR 0014 §2); empty until coverage is computed.
                items:
                  description: BlindSpot is an entity of the scope the role cannot
                    read.
                  properties:
                    entity:
                      description: |-
                        EntityKey is a Map entry's key, type/name, with one of spec 08's eleven
                        type prefixes.
                      maxLength: 253
                      pattern: ^(service|compute|datastore|storage|network|identity|external|team|environment|observability|runbook)/[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                    message:
                      type: string
                    reason:
                      description: BlindSpotReason says why an entity is not covered.
                      enum:
                      - NoAccess
                      - ConnectorNotReady
                      - NotInMap
                      - NotValidated
                      type: string
                  required:
                  - entity
                  - reason
                  type: object
                maxItems: 200
                type: array
                x-kubernetes-list-map-keys:
                - entity
                x-kubernetes-list-type: map
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastMaintenance:
                description: The last TakeCareMaintenance started.
                type: string
              lastMaintenanceTime:
                format: date-time
                type: string
              level:
                description: Effective level, which differs from spec.level when the
                  requested one is not supported.
                enum:
                - Apprentice
                - Practitioner
                - Expert
                type: string
              nextMaintenanceTime:
                description: When the schedule runs the next maintenance.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              pendingTrigger:
                description: |-
                  A due scheduled maintenance that met a running one: the next
                  maintenance, one at most, created when the current one ends. Kept in
                  status, so that a restart does not lose it.
                enum:
                - Schedule
                - OnDemand
                type: string
              renderPendingSince:
                description: |-
                  RenderPendingSince is set while a new rendering of the engine's agent
                  waits for a running maintenance to end (a re-rendered agent restarts
                  and loses its task). The gateway's policies are never deferred.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'a Mécano''s name is at most 47 characters: its engine agent takecare-mecano-<name>
            is a Kubernetes service name (63)'
          optionalOldSelf: true
          rule: oldSelf.hasValue() || size(self.metadata.name) <= 47
    served: true
    storage: true
    subresources:
      status: {}
