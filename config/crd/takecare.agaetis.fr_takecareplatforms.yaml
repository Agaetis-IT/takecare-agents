---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: takecareplatforms.takecare.agaetis.fr
spec:
  group: takecare.agaetis.fr
  names:
    categories:
    - takecare
    kind: TakeCarePlatform
    listKind: TakeCarePlatformList
    plural: takecareplatforms
    shortNames:
    - tcplatform
    singular: takecareplatform
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="ProductionReady")].status
      name: Production
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TakeCarePlatform is the cluster-wide core of TakeCare. There is exactly one,
          named main.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TakeCarePlatformSpec is the core of TakeCare: models, gateway, engine
              location and telemetry (spec 01). Deployment concerns are chart values, not
              API fields.
            properties:
              engine:
                default: {}
                description: |-
                  EngineSpec says where the agent engine runs. It is neutral on purpose: the
                  API never names the engine (ADR 0007).
                properties:
                  namespace:
                    default: kagent
                    description: |-
                      Namespace where the engine runs and where the operator writes the
                      objects it generates for it.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                type: object
              gateway:
                description: GatewaySpec locates the Gateway API Gateway served by
                  agentgateway.
                properties:
                  gatewayRef:
                    description: Existing Gateway to use. When unset, the chart's
                      Gateway is used.
                    properties:
                      name:
                        minLength: 1
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              models:
                description: Models served through the gateway. The first one is the
                  default.
                items:
                  description: ModelSpec declares one model.
                  properties:
                    apiKeySecretRef:
                      description: |-
                        Secret, in the operator namespace, holding the provider key. The key
                        never leaves the gateway (ADR 0004).
                      properties:
                        key:
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    baseURL:
                      description: Absolute http or https URL of the provider's OpenAI-compatible
                        API.
                      pattern: ^https?://[^\s]+$
                      type: string
                    model:
                      minLength: 1
                      type: string
                    name:
                      description: Unique DNS-1123 label, referenced by RoleCommonSpec.Model.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    pricing:
                      description: Pricing prices the usage reported by the gateway,
                        per million tokens.
                      properties:
                        cachedInputPerMTok:
                          minimum: 0
                          type: number
                        currency:
                          minLength: 1
                          type: string
                        inputPerMTok:
                          minimum: 0
                          type: number
                        outputPerMTok:
                          minimum: 0
                          type: number
                      required:
                      - currency
                      - inputPerMTok
                      - outputPerMTok
                      type: object
                    provider:
                      default: openai-compatible
                      enum:
                      - openai-compatible
                      type: string
                  required:
                  - apiKeySecretRef
                  - baseURL
                  - model
                  - name
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observability:
                default: {}
                description: ObservabilitySpec configures telemetry (ADR 0006).
                properties:
                  captureContent:
                    default: false
                    description: Record prompts, tool arguments and answers in traces.
                      Off by default.
                    type: boolean
                  metrics:
                    description: MetricsSpec points at a Prometheus that scrapes the
                      gateway (usage and cost).
                    properties:
                      prometheusURL:
                        pattern: ^https?://[^\s]+$
                        type: string
                    required:
                    - prometheusURL
                    type: object
                  otlp:
                    description: OTLPSpec is the OTLP export destination.
                    properties:
                      endpoint:
                        pattern: ^https?://[^\s]+$
                        type: string
                      protocol:
                        default: grpc
                        enum:
                        - grpc
                        - http
                        type: string
                    required:
                    - endpoint
                    type: object
                  sampling:
                    default: 1
                    description: Trace sampling ratio.
                    maximum: 1
                    minimum: 0
                    type: number
                type: object
            required:
            - models
            type: object
          status:
            description: TakeCarePlatformStatus is the observed state of the platform.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              models:
                items:
                  description: ModelStatus is the gateway route serving a model.
                  properties:
                    name:
                      type: string
                    route:
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              productionGaps:
                description: Advisory gaps behind the ProductionReady condition.
                items:
                  description: ProductionGap is one thing missing for a real production.
                  properties:
                    detail:
                      type: string
                    id:
                      type: string
                  required:
                  - id
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the TakeCarePlatform is a singleton and must be named main
          rule: self.metadata.name == 'main'
    served: true
    storage: true
    subresources:
      status: {}
