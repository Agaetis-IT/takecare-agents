---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    helm.sh/resource-policy: keep
  name: takecaremaintenances.takecare.agaetis.fr
spec:
  group: takecare.agaetis.fr
  names:
    categories:
    - takecare
    kind: TakeCareMaintenance
    listKind: TakeCareMaintenanceList
    plural: takecaremaintenances
    singular: takecaremaintenance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.trigger
      name: Trigger
      type: string
    - jsonPath: .status.counts.findings
      name: Findings
      type: integer
    - jsonPath: .status.counts.now
      name: Now
      type: integer
    - jsonPath: .status.counts.pullRequests
      name: PR
      type: integer
    - jsonPath: .status.published.ok
      name: Published
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TakeCareMaintenance is one maintenance by the Mécano: the inventory,
          the findings and, at Practitioner, the upgrade plan and its pull
          requests.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TakeCareMaintenanceSpec records what a maintenance answers. The
              operator, or a person for an on-demand maintenance, writes it once; it
              never changes.
            properties:
              components:
                description: |-
                  Narrows an on-demand maintenance to these components, by Map key or
                  image repository; empty for the whole scope.
                items:
                  maxLength: 253
                  minLength: 1
                  type: string
                maxItems: 20
                type: array
                x-kubernetes-list-type: set
              level:
                description: |-
                  The Mécano's effective level when the maintenance was created. Empty
                  on a maintenance made by hand: the Mécano's effective level when it
                  starts.
                enum:
                - Apprentice
                - Practitioner
                - Expert
                type: string
              mecanoRef:
                description: |-
                  RoleRef names the role resource that owns a record: an investigation,
                  a survey or a review.
                properties:
                  kind:
                    enum:
                    - TakeCareDoc
                    - TakeCareIntendant
                    - TakeCareKine
                    - TakeCareMecano
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
              silent:
                description: |-
                  Silent maintenances are never published and never proposed (status
                  only), for the bench.
                type: boolean
              trigger:
                default: OnDemand
                description: MaintenanceTrigger says what started a maintenance (spec
                  12 §3).
                enum:
                - Schedule
                - OnDemand
                type: string
            required:
            - mecanoRef
            type: object
            x-kubernetes-validations:
            - message: the spec of a maintenance is immutable
              rule: self == oldSelf
            - message: a maintenance belongs to a TakeCareMecano
              rule: self.mecanoRef.kind == 'TakeCareMecano'
          status:
            description: TakeCareMaintenanceStatus is a maintenance's run and what
              it found.
            properties:
              attempts:
                description: |-
                  How many times the run was started: a task lost to a restart is
                  retried once, then the run fails with the reason.
                format: int32
                minimum: 0
                type: integer
              blindSpots:
                description: What the maintenance could not read, with the reason.
                items:
                  description: NotSeen is a part of the ground a survey could not
                    read.
                  properties:
                    reason:
                      maxLength: 1024
                      minLength: 1
                      type: string
                    ref:
                      description: 'What was not read: a namespace, a connector, an
                        API group.'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - reason
                  - ref
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              counts:
                description: |-
                  MaintenanceCounts counts a maintenance's findings and pull requests,
                  for its printer columns.
                properties:
                  findings:
                    format: int32
                    minimum: 0
                    type: integer
                  now:
                    description: The findings of severity Now.
                    format: int32
                    minimum: 0
                    type: integer
                  pullRequests:
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - findings
                - now
                - pullRequests
                type: object
              degraded:
                description: |-
                  Set when the run went on without some of its sources (a connector
                  down): the output says so, the run is not failed for it.
                properties:
                  connectors:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  reason:
                    type: string
                type: object
              engine:
                description: |-
                  Which engine ran it. Free strings: the engine is not an API concept,
                  only something the operator records (ADR 0007).
                properties:
                  agent:
                    type: string
                  kind:
                    type: string
                  taskID:
                    type: string
                type: object
              findings:
                items:
                  description: |-
                    MaintenanceFinding is the agent's prioritised reading of one fact of
                    the inventory.
                  properties:
                    component:
                      maxLength: 253
                      type: string
                    evidence:
                      items:
                        description: |-
                          Evidence is a tool call that backs a finding: the tool and the record it
                          read, never its output.
                        properties:
                          record:
                            maxLength: 253
                            type: string
                          tool:
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - tool
                        type: object
                      maxItems: 10
                      type: array
                      x-kubernetes-list-type: atomic
                    id:
                      description: |-
                        Stable across maintenances: <kind>/<component>, or
                        RemovedAPI/<apiVersion>/<kind> (spec 12 §2).
                      maxLength: 320
                      minLength: 1
                      type: string
                    kind:
                      description: FindingKind is what a maintenance finding is about.
                      enum:
                      - Behind
                      - EndOfSupport
                      - RemovedAPI
                      - Certificate
                      - Drift
                      type: string
                    severity:
                      description: Severity says when a finding needs work.
                      enum:
                      - Now
                      - Soon
                      - Later
                      type: string
                    text:
                      maxLength: 512
                      minLength: 1
                      type: string
                  required:
                  - id
                  - kind
                  - severity
                  - text
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              findingsOmitted:
                description: How many findings the answer held past the ones kept.
                format: int32
                minimum: 0
                type: integer
              inventory:
                description: MaintenanceInventory is the collector's facts (spec 12
                  §4), bounded.
                properties:
                  apis:
                    description: Objects on a deprecated or removed apiVersion.
                    items:
                      description: DeprecatedAPIUse is an object on a deprecated or
                        removed apiVersion.
                      properties:
                        apiVersion:
                          maxLength: 253
                          minLength: 1
                          type: string
                        kind:
                          maxLength: 63
                          minLength: 1
                          type: string
                        name:
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          maxLength: 63
                          type: string
                        removedIn:
                          description: The Kubernetes minor that removes it, for example
                            "1.32".
                          maxLength: 16
                          type: string
                        replacement:
                          description: The apiVersion to move to.
                          maxLength: 253
                          type: string
                        where:
                          description: Live, Git or both.
                          items:
                            description: |-
                              APIWhere says where an object on a deprecated or removed apiVersion
                              was found.
                            enum:
                            - Live
                            - Git
                            type: string
                          maxItems: 2
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                      required:
                      - apiVersion
                      - kind
                      - name
                      - where
                      type: object
                    maxItems: 100
                    type: array
                    x-kubernetes-list-type: atomic
                  certificates:
                    description: cert-manager Certificates near expiry or not Ready.
                    items:
                      description: CertificateState is a cert-manager Certificate
                        near expiry or not Ready.
                      properties:
                        name:
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          maxLength: 63
                          minLength: 1
                          type: string
                        notAfter:
                          format: date-time
                          type: string
                        ready:
                          type: boolean
                      required:
                      - name
                      - namespace
                      - ready
                      type: object
                    maxItems: 100
                    type: array
                    x-kubernetes-list-type: atomic
                  components:
                    items:
                      description: InventoryComponent is one component, live, declared
                        and published.
                      properties:
                        declared:
                          description: The version Git declares.
                          maxLength: 128
                          type: string
                        drift:
                          default: Unknown
                          description: Drift says how what runs live and what Git
                            declares differ, per object.
                          enum:
                          - None
                          - Version
                          - NotInGit
                          - NotLive
                          - Unknown
                          type: string
                        evidence:
                          items:
                            description: |-
                              Evidence is a tool call that backs a finding: the tool and the record it
                              read, never its output.
                            properties:
                              record:
                                maxLength: 253
                                type: string
                              tool:
                                maxLength: 253
                                minLength: 1
                                type: string
                            required:
                            - tool
                            type: object
                          maxItems: 10
                          type: array
                          x-kubernetes-list-type: atomic
                        key:
                          description: |-
                            A Map key when the component resolves to one, otherwise its image
                            repository or chart name.
                          maxLength: 253
                          minLength: 1
                          type: string
                        latest:
                          description: The newest version published.
                          maxLength: 128
                          type: string
                        live:
                          description: The version running.
                          maxLength: 128
                          type: string
                        supportEnds:
                          description: When the line running stops being supported.
                          format: date-time
                          type: string
                      required:
                      - key
                      type: object
                    maxItems: 200
                    type: array
                    x-kubernetes-list-type: atomic
                  gitops:
                    description: GitOps applications not in sync.
                    items:
                      description: |-
                        GitOpsState is an Argo CD Application or a Flux Kustomization not in
                        sync.
                      properties:
                        kind:
                          enum:
                          - Application
                          - Kustomization
                          type: string
                        name:
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          maxLength: 63
                          minLength: 1
                          type: string
                        revision:
                          maxLength: 253
                          type: string
                        state:
                          description: The tool's own state, for example OutOfSync.
                          maxLength: 63
                          type: string
                      required:
                      - kind
                      - name
                      - namespace
                      type: object
                    maxItems: 100
                    type: array
                    x-kubernetes-list-type: atomic
                  omitted:
                    description: How many items each list held past its bound.
                    properties:
                      apis:
                        format: int32
                        minimum: 0
                        type: integer
                      certificates:
                        format: int32
                        minimum: 0
                        type: integer
                      components:
                        format: int32
                        minimum: 0
                        type: integer
                      gitops:
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                type: object
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  RunPhase is where a run of an agent role stands. The shared phases are
                  below; each record kind validates its own set, which may add phases.
                type: string
              plan:
                description: The upgrade plan, Practitioner only.
                properties:
                  evidence:
                    description: What was read on the copy, when tested is OnCopy.
                    items:
                      description: |-
                        Evidence is a tool call that backs a finding: the tool and the record it
                        read, never its output.
                      properties:
                        record:
                          maxLength: 253
                          type: string
                        tool:
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - tool
                      type: object
                    maxItems: 10
                    type: array
                    x-kubernetes-list-type: atomic
                  pullRequests:
                    description: |-
                      The pull requests the propose tool opened, one per repository at
                      most.
                    items:
                      description: |-
                        PullRequestRef is a pull request (a merge request on GitLab) as the
                        propose tool returned it.
                      properties:
                        branch:
                          maxLength: 80
                          pattern: ^takecare/mecano/[a-z0-9][a-z0-9-]{0,62}$
                          type: string
                        repository:
                          maxLength: 255
                          minLength: 1
                          type: string
                        url:
                          maxLength: 2048
                          pattern: ^https://[^\s]+$
                          type: string
                      required:
                      - branch
                      - repository
                      - url
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - repository
                    x-kubernetes-list-type: map
                  steps:
                    description: In order.
                    items:
                      description: PlanStep is one step of a plan.
                      properties:
                        class:
                          description: |-
                            ActionClass is the spec 14 class of a plan step, from least to most
                            harmful.
                          enum:
                          - reversible
                          - disruptive
                          - destructive
                          type: string
                        findings:
                          description: The findings the step answers, by id.
                          items:
                            maxLength: 320
                            type: string
                          maxItems: 50
                          type: array
                          x-kubernetes-list-type: set
                        id:
                          maxLength: 63
                          minLength: 1
                          type: string
                        text:
                          maxLength: 512
                          minLength: 1
                          type: string
                      required:
                      - class
                      - id
                      - text
                      type: object
                    maxItems: 20
                    type: array
                    x-kubernetes-list-map-keys:
                    - id
                    x-kubernetes-list-type: map
                  tested:
                    default: NotTested
                    description: PlanTested says whether a plan was seen working on
                      the team's copy.
                    enum:
                    - OnCopy
                    - NotTested
                    type: string
                required:
                - tested
                type: object
                x-kubernetes-validations:
                - message: a plan tested on a copy names the copy's evidence
                  rule: self.tested != 'OnCopy' || (has(self.evidence) && size(self.evidence)
                    > 0)
              published:
                description: |-
                  The publication through the Mécano's report connector: unset while
                  the operator still has to publish, or says why nothing is published.
                properties:
                  connector:
                    type: string
                  destination:
                    type: string
                  ok:
                    type: boolean
                  reason:
                    type: string
                required:
                - ok
                type: object
              reason:
                description: |-
                  Why the run is in its phase: for Failed, TimedOut and Dropped, why it
                  ended; for Queued, why it waits (DocNotRunnable, WaitingForSlot).
                type: string
              startedAt:
                format: date-time
                type: string
              traceID:
                type: string
              usage:
                description: Usage is the model usage of one run.
                properties:
                  approximate:
                    description: |-
                      True when the usage could not be attributed to this run alone: runs
                      overlapped, or another role shares the model (spec 02 §5).
                    type: boolean
                  cachedInputTokens:
                    format: int64
                    type: integer
                  estimatedCost:
                    description: Estimated cost with its currency, for example "0.0093
                      USD".
                    type: string
                  inputTokens:
                    format: int64
                    type: integer
                  modelCalls:
                    format: int64
                    type: integer
                  outputTokens:
                    format: int64
                    type: integer
                required:
                - inputTokens
                - modelCalls
                - outputTokens
                type: object
            type: object
            x-kubernetes-validations:
            - message: phase must be Queued, Running, Completed, Failed or Dropped
              rule: '!has(self.phase) || self.phase in [''Queued'', ''Running'', ''Completed'',
                ''Failed'', ''Dropped'']'
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'a maintenance''s name is at most 63 characters, without a dot:
            it names its pull request''s branch takecare/mecano/<name>'
          optionalOldSelf: true
          rule: oldSelf.hasValue() || (size(self.metadata.name) <= 63 && !self.metadata.name.contains('.'))
    served: true
    storage: true
    subresources:
      status: {}
