---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    helm.sh/resource-policy: keep
  name: takecaredocs.takecare.agaetis.fr
spec:
  group: takecare.agaetis.fr
  names:
    categories:
    - takecare
    kind: TakeCareDoc
    listKind: TakeCareDocList
    plural: takecaredocs
    shortNames:
    - tcdoc
    singular: takecaredoc
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.level
      name: Level
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'TakeCareDoc is the Doc: it diagnoses incidents, read-only.'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TakeCareDocSpec configures the Doc, the incident diagnosis
              role (spec 02).
            properties:
              actTools:
                description: Act tools, seasoned level only. Accepted and ignored
                  in milestone 1.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              alerts:
                description: AlertsSpec filters the alerts the Doc handles.
                properties:
                  matchers:
                    description: 'Alertmanager-style equality matchers. Default: every
                      alert in scope.'
                    items:
                      description: AlertMatcher matches one alert label.
                      properties:
                        name:
                          minLength: 1
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              connectors:
                description: |-
                  Connectors bound to the Doc, by type. cluster and metrics are required,
                  report from the service level: the controller reports a missing one
                  (MissingConnectorType) rather than the schema rejecting it.
                properties:
                  changes:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  cluster:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  knowledge:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  metrics:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  report:
                    description: 'The report connector: where the operator publishes
                      diagnoses.'
                    type: string
                  tickets:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
              investigation:
                default: {}
                description: InvestigationSettings bounds how investigations run.
                properties:
                  cooldown:
                    default: 15m
                    description: Minimum time between two investigations of the same
                      alert fingerprint.
                    type: string
                  maxConcurrent:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                  timeout:
                    default: 300s
                    type: string
                type: object
              level:
                default: trial
                description: Intervention level. Defaults to trial.
                enum:
                - trial
                - service
                - seasoned
                type: string
              model:
                description: Overrides the model declared in the TakeCarePlatform.
                properties:
                  name:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              report:
                description: Destinations of the report connector, by level.
                properties:
                  service:
                    description: Destination at the service level.
                    type: string
                  trial:
                    description: 'Destination at the trial level. Unset: diagnoses
                      stay in status.'
                    type: string
                type: object
              scope:
                description: Namespaces the role may read (and, at the seasoned level,
                  modify).
                properties:
                  namespaces:
                    items:
                      description: Namespace is a Kubernetes namespace name.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - namespaces
                type: object
              suspend:
                description: 'Pause without deletion: the role stops handling anything.'
                type: boolean
            required:
            - scope
            type: object
          status:
            description: TakeCareDocStatus is the observed state of the Doc.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastInvestigation:
                type: string
              lastInvestigationTime:
                format: date-time
                type: string
              level:
                description: Effective level, which differs from spec.level when the
                  requested one is not supported.
                enum:
                - trial
                - service
                - seasoned
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
