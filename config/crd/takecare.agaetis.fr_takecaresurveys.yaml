---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    helm.sh/resource-policy: keep
  name: takecaresurveys.takecare.agaetis.fr
spec:
  group: takecare.agaetis.fr
  names:
    categories:
    - takecare
    kind: TakeCareSurvey
    listKind: TakeCareSurveyList
    plural: takecaresurveys
    shortNames:
    - tcsurvey
    singular: takecaresurvey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.intendantRef.name
      name: Intendant
      type: string
    - jsonPath: .spec.trigger
      name: Trigger
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.mapRevision
      name: Revision
      type: string
    - jsonPath: .status.proposalCounts.total
      name: Proposals
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TakeCareSurvey is one survey of the ground by the Intendant: a record of
          what it read, could not read, and proposes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TakeCareSurveySpec records what a survey answers. The operator, or a
              human for an on-demand survey, writes it once; it never changes.
            properties:
              intendantRef:
                description: RoleRef names the role resource that owns an investigation.
                properties:
                  kind:
                    enum:
                    - TakeCareDoc
                    - TakeCareIntendant
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
              mapRevision:
                description: |-
                  The Map revision to survey against. Empty: the revision the map
                  connector serves when the survey starts.
                maxLength: 128
                type: string
              trigger:
                default: OnDemand
                description: SurveyTrigger says what started a survey (spec 10 §3).
                enum:
                - Schedule
                - OnDemand
                - MapRevision
                - Registration
                type: string
            required:
            - intendantRef
            type: object
            x-kubernetes-validations:
            - message: the spec of a survey is immutable
              rule: self == oldSelf
            - message: a survey belongs to a TakeCareIntendant
              rule: self.intendantRef.kind == 'TakeCareIntendant'
          status:
            description: TakeCareSurveyStatus is a survey's run and what it found.
            properties:
              attempts:
                description: |-
                  How many times the run was started: a task lost to a restart is
                  retried once, then the run fails with the reason.
                format: int32
                minimum: 0
                type: integer
              blindSpots:
                description: Entities of the Intendant's scope the survey could not
                  read.
                items:
                  description: BlindSpot is an entity of the scope the role cannot
                    read.
                  properties:
                    entity:
                      description: |-
                        EntityKey is a Map entry's key, type/name, with one of spec 08's eleven
                        type prefixes.
                      maxLength: 253
                      pattern: ^(service|compute|datastore|storage|network|identity|external|team|environment|observability|runbook)/[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                    message:
                      type: string
                    reason:
                      description: BlindSpotReason says why an entity is not covered.
                      enum:
                      - NoAccess
                      - ConnectorNotReady
                      - NotInMap
                      - NotValidated
                      type: string
                  required:
                  - entity
                  - reason
                  type: object
                maxItems: 200
                type: array
                x-kubernetes-list-map-keys:
                - entity
                x-kubernetes-list-type: map
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              degraded:
                description: |-
                  Set when the run went on without some of its sources (a connector
                  down): the output says so, the run is not failed for it.
                properties:
                  connectors:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  reason:
                    type: string
                type: object
              engine:
                description: |-
                  Which engine ran it. Free strings: the engine is not an API concept,
                  only something the operator records (ADR 0007).
                properties:
                  agent:
                    type: string
                  kind:
                    type: string
                  taskID:
                    type: string
                type: object
              inventory:
                description: |-
                  Inventory counts the agents and MCP servers in circulation, from the
                  cluster and the registry (spec 10 §8).
                properties:
                  agents:
                    format: int32
                    minimum: 0
                    type: integer
                  mcpServers:
                    format: int32
                    minimum: 0
                    type: integer
                  tools:
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - agents
                - mcpServers
                - tools
                type: object
              layers:
                items:
                  description: SurveyLayer is what a survey found on one layer of
                    the ground.
                  properties:
                    matched:
                      description: Objects that match an existing entry.
                      format: int32
                      minimum: 0
                      type: integer
                    name:
                      description: |-
                        The layer: environment, compute, network, identity, storage,
                        alerting or knowledge.
                      maxLength: 63
                      minLength: 1
                      type: string
                    notSeen:
                      description: 'What a connector could not read, with its reason:
                        never silence.'
                      items:
                        description: NotSeen is a part of the ground a survey could
                          not read.
                        properties:
                          reason:
                            maxLength: 1024
                            minLength: 1
                            type: string
                          ref:
                            description: 'What was not read: a namespace, a connector,
                              an API group.'
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - reason
                        - ref
                        type: object
                      maxItems: 50
                      type: array
                      x-kubernetes-list-type: atomic
                    proposed:
                      description: Proposals made from this layer.
                      format: int32
                      minimum: 0
                      type: integer
                    seen:
                      description: Objects read on the ground.
                      format: int32
                      minimum: 0
                      type: integer
                  required:
                  - matched
                  - name
                  - proposed
                  - seen
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              mapRevision:
                description: The Map revision surveyed against.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  RunPhase is where a run of an agent role stands. The shared phases are
                  below; each record kind validates its own set, which may add phases.
                type: string
              proposalCounts:
                description: ProposalCounts counts a survey's proposals, the full
                  set included.
                properties:
                  add:
                    format: int32
                    minimum: 0
                    type: integer
                  remove:
                    format: int32
                    minimum: 0
                    type: integer
                  total:
                    format: int32
                    minimum: 0
                    type: integer
                  update:
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - add
                - remove
                - total
                - update
                type: object
              proposals:
                description: The first proposals; the full set is in proposalsConfigMap.
                items:
                  description: |-
                    Proposal is one change the survey proposes to the Map (spec 10 §7). It
                    carries names and hostnames, never a value.
                  properties:
                    action:
                      description: ProposalAction is what a proposal does to the Map.
                      enum:
                      - Add
                      - Update
                      - Remove
                      type: string
                    entry:
                      description: The entry's file as spec 08 §4 would hold it (YAML).
                      maxLength: 8192
                      type: string
                    evidence:
                      description: The tool calls that support the proposal, by name;
                        never their output.
                      items:
                        maxLength: 253
                        type: string
                      maxItems: 20
                      type: array
                      x-kubernetes-list-type: atomic
                    id:
                      description: 'Stable across surveys: a hash of the action and
                        the key.'
                      maxLength: 64
                      minLength: 1
                      type: string
                    key:
                      description: |-
                        EntityKey is a Map entry's key, type/name, with one of spec 08's eleven
                        type prefixes.
                      maxLength: 253
                      pattern: ^(service|compute|datastore|storage|network|identity|external|team|environment|observability|runbook)/[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                    source:
                      description: |-
                        ProposalSource says who made a proposal: the deterministic import or the
                        agent pass (spec 10 §4, §5).
                      enum:
                      - Import
                      - Agent
                      type: string
                  required:
                  - action
                  - id
                  - key
                  - source
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              proposalsConfigMap:
                description: |-
                  The ConfigMap, owned by the survey, that holds the full set of
                  proposals.
                type: string
              reason:
                description: Why the run is in its phase, for Failed and Dropped.
                type: string
              startedAt:
                format: date-time
                type: string
              traceID:
                type: string
              usage:
                description: Usage is the model usage of one run.
                properties:
                  approximate:
                    description: |-
                      True when the usage could not be attributed to this run alone: runs
                      overlapped, or another role shares the model (spec 02 §5).
                    type: boolean
                  cachedInputTokens:
                    format: int64
                    type: integer
                  estimatedCost:
                    description: Estimated cost with its currency, for example "0.0093
                      USD".
                    type: string
                  inputTokens:
                    format: int64
                    type: integer
                  modelCalls:
                    format: int64
                    type: integer
                  outputTokens:
                    format: int64
                    type: integer
                required:
                - inputTokens
                - modelCalls
                - outputTokens
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
