# Every job calls a Makefile target: what runs in CI runs the same way locally.
# Tool versions come from hack/versions.env; actions are pinned by commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (go, shell, markdown, spdx)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint

  test:
    name: test (unit, golden, envtest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The pinned chart archives, restored when the pins are the same (spec
      # 04): make chart-deps then downloads only what is missing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: charts/*/charts
          key: chart-deps-${{ hashFiles('hack/versions.env', 'charts/*/Chart.lock') }}
      - run: make generate
      - name: generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "run make generate and commit the result"
            exit 1
          fi
      - run: make test

  chart:
    name: chart (sync, helm lint, template, kubeconform)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The pinned chart archives, restored when the pins are the same (spec
      # 04): make chart-deps then downloads only what is missing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: charts/*/charts
          key: chart-deps-${{ hashFiles('hack/versions.env', 'charts/*/Chart.lock') }}
      # Helm 4 and kubeconform are downloaded by the Makefile at the versions
      # and checksums pinned in hack/versions.env.
      - run: make chart-lint chart-template

  licenses:
    name: licenses (NOTICE up to date, no copyleft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make licenses

  image:
    name: image (amd64 + arm64, no push)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A required check: on a PR touching none of the image's inputs, the
      # job stays and passes, its build steps skipped.
      - id: paths
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != pull_request ] || git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD |
            grep -qE '^(api|internal|cmd|test|config)/|^(Dockerfile|\.dockerignore|go\.mod|go\.sum|Makefile|hack/versions\.env|\.github/workflows/ci\.yaml)$'; then
            echo build=true >>"$GITHUB_OUTPUT"
          else
            echo "no image input changed: build skipped"
          fi
      # The Dockerfile cross-compiles on the build platform: no QEMU needed.
      - if: steps.paths.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The Actions cache's URL and token, for buildx's type=gha cache.
      - if: steps.paths.outputs.build == 'true'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # amd64 only on pull requests; both platforms on main (and in the release).
      - if: steps.paths.outputs.build == 'true'
        run: make docker-buildx PUSH=false ${{ github.event_name == 'pull_request' && 'IMAGE_PLATFORMS=linux/amd64' || '' }}

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: make gitleaks GITLEAKS_MODE=git

  dco:
    name: dco (every commit signed off)
    # Pull requests opened by GitHub Apps (Dependabot) sign off with another
    # address than their author's; GitHub sets the opener's type, a commit
    # cannot. A skipped required check counts as passed.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - run: make dco DCO_BASE="$BASE" DCO_HEAD="$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
