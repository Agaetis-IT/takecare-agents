# Every job calls a Makefile target: what runs in CI runs the same way locally.
# Tool versions come from hack/versions.env; actions are pinned by commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (go, shell, markdown, spdx)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make lint

  test:
    name: test (unit, golden, envtest)
    # checks: read for hack/ci-changes.sh, which reads this job's run at
    # the previous head; nothing else beyond the workflow's contents: read.
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-24.04
    # About 12 minutes (16 at worst): a hung run stops here instead of
    # after GitHub's six hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A required check: the steps below run unless every file of this push,
      # or of the whole pull request, is one no Go test reads (bench reports,
      # docs, the root's Markdown, the site; hack/ci-changes.sh). The job
      # still reports, its steps skipped.
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          # The previous head's run of this job (hack/ci-changes.sh).
          CHECK: test (unit, golden, envtest)
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: hack/ci-changes.sh go >>"$GITHUB_OUTPUT"
      - if: steps.changes.outputs.heavy == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The pinned chart archives, restored when the pins are the same (spec
      # 04): make chart-deps then downloads only what is missing.
      - if: steps.changes.outputs.heavy == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: charts/*/charts
          key: chart-deps-${{ hashFiles('hack/versions.env', 'charts/*/Chart.lock') }}
      - if: steps.changes.outputs.heavy == 'true'
        run: make generate
      - name: generated files are committed
        if: steps.changes.outputs.heavy == 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "run make generate and commit the result"
            exit 1
          fi
      - if: steps.changes.outputs.heavy == 'true'
        run: make test

  chart:
    name: chart (sync, helm lint, template, kubeconform)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The pinned chart archives, restored when the pins are the same (spec
      # 04): make chart-deps then downloads only what is missing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: charts/*/charts
          key: chart-deps-${{ hashFiles('hack/versions.env', 'charts/*/Chart.lock') }}
      # Helm 4 and kubeconform are downloaded by the Makefile at the versions
      # and checksums pinned in hack/versions.env.
      - run: make chart-lint chart-template

  licenses:
    name: licenses (NOTICE up to date, no copyleft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make licenses

  image:
    name: image (amd64 + arm64, no push)
    # checks: read for hack/ci-changes.sh, which reads this job's run at
    # the previous head; nothing else beyond the workflow's contents: read.
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A required check: on a PR touching none of the image's inputs, or
      # whose push or whole diff has only files no image reads (bench
      # reports, docs, the root's Markdown, the site; hack/ci-changes.sh),
      # the job stays and passes, its build steps skipped.
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          # The previous head's run of this job (hack/ci-changes.sh).
          CHECK: image (amd64 + arm64, no push)
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo build=true >>"$GITHUB_OUTPUT"
            exit 0
          fi
          heavy="$(hack/ci-changes.sh go)"
          if [ "$heavy" != heavy=true ]; then
            echo "only files no image reads changed: build skipped"
            exit 0
          fi
          # The list is read on its own, so that a failed diff stops here.
          changed="$(git diff --name-only "$BASE" HEAD)"
          if grep -qE '^(api|internal|cmd|test|config)/|^(Dockerfile|\.dockerignore|go\.mod|go\.sum|Makefile|hack/versions\.env|\.github/workflows/ci\.yaml)$' <<<"$changed"; then
            echo build=true >>"$GITHUB_OUTPUT"
          else
            echo "no image input changed: build skipped"
          fi
      # The Dockerfile cross-compiles on the build platform: no QEMU needed.
      - if: steps.paths.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The Actions cache's URL and token, for buildx's type=gha cache.
      - if: steps.paths.outputs.build == 'true'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # amd64 only on pull requests; both platforms on main (and in the release).
      - if: steps.paths.outputs.build == 'true'
        run: make docker-buildx PUSH=false ${{ github.event_name == 'pull_request' && 'IMAGE_PLATFORMS=linux/amd64' || '' }}

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: make gitleaks GITLEAKS_MODE=git

  dco:
    name: dco (every commit signed off)
    # Pull requests opened by GitHub Apps (Dependabot) sign off with another
    # address than their author's; GitHub sets the opener's type, a commit
    # cannot. A skipped required check counts as passed.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - run: make dco DCO_BASE="$BASE" DCO_HEAD="$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
