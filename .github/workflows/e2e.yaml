# The end-to-end test (spec 04): the demo on k3d with the fake model
# provider and the fake Slack, and the complete Doc path checked
# (hack/e2e.sh). On pull requests that touch what it runs (the paths
# below), and on every push to main, the safety net for the rest.
# No secret: the fakes take placeholders, and nothing leaves the runner but
# image pulls.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - api/**
      - internal/**
      - cmd/**
      - charts/**
      - hack/**
      - test/**
      - config/**
      - demo/**
      - Makefile
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - .github/workflows/e2e.yaml

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: end-to-end on k3d (fake model, fake Slack)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The steps below run unless every file of this push, or of the whole
      # pull request, is one no Go test, image or cluster reads (bench
      # reports, docs, the root's Markdown, the site; hack/ci-changes.sh).
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
        run: hack/ci-changes.sh go >>"$GITHUB_OUTPUT"
      - if: steps.changes.outputs.heavy == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The pinned chart archives, restored when the pins are the same (spec
      # 04): make chart-deps then downloads only what is missing.
      - if: steps.changes.outputs.heavy == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: charts/*/charts
          key: chart-deps-${{ hashFiles('hack/versions.env', 'charts/*/Chart.lock') }}
      # The Docker Hub images of the demo profile, pulled once and kept when
      # the pins are the same; each is checked against the Id recorded at
      # its pull before it is imported into k3d (hack/preload-images.sh).
      - if: steps.changes.outputs.heavy == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/preload
          key: preload-images-${{ hashFiles('hack/versions.env', 'charts/*/Chart.lock', 'hack/preload-images.sh') }}
      - if: steps.changes.outputs.heavy == 'true'
        name: install k3d (version and checksum from hack/versions.env)
        run: |
          set -euo pipefail
          source hack/versions.env
          curl -fsSL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256_LINUX_AMD64}  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      # The same room as the chart smoke: the demo's images and the agent's
      # under the kubelet's eviction threshold otherwise. The same rule
      # too: remove only when the room is short.
      - if: steps.changes.outputs.heavy == 'true'
        name: free the runner's disk
        run: |
          set -euo pipefail
          df -h /
          free_gb() { df --output=avail -BG / | tail -1 | tr -dc '0-9'; }
          if [ "$(free_gb)" -lt 20 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
            df -h /
          else
            echo "$(free_gb) GB free: nothing removed"
          fi
          free=$(free_gb)
          if [ "$free" -lt 20 ]; then
            echo "only ${free} GB free: the e2e needs about 20 GB (images, the agent's included)" >&2
            exit 1
          fi
      # The images' layers in the Actions cache, in the image job's scopes
      # (Makefile, DOCKER_BUILD): the runner's Docker exports a type=gha
      # cache only through a buildx builder.
      - if: steps.changes.outputs.heavy == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The Actions cache's URL and token, for buildx's type=gha cache.
      - if: steps.changes.outputs.heavy == 'true'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - if: steps.changes.outputs.heavy == 'true'
        run: make e2e
      - name: cluster state on failure
        if: failure() && steps.changes.outputs.heavy == 'true'
        run: hack/e2e.sh status || true
