# The end-to-end test (spec 04): the demo on k3d with the fake model
# provider and the fake Slack, and the complete Doc path checked
# (hack/e2e.sh). On pull requests labelled e2e, and on every push to main.
# No secret: the fakes take placeholders, and nothing leaves the runner but
# image pulls.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: end-to-end on k3d (fake model, fake Slack)
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The pinned chart archives, restored when the pins are the same (spec
      # 04): make chart-deps then downloads only what is missing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: charts/*/charts
          key: chart-deps-${{ hashFiles('hack/versions.env', 'charts/*/Chart.lock') }}
      - name: install k3d (version and checksum from hack/versions.env)
        run: |
          set -euo pipefail
          source hack/versions.env
          curl -fsSL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256_LINUX_AMD64}  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      # The same room as the chart smoke: the demo's images and the agent's
      # under the kubelet's eviction threshold otherwise.
      - name: free the runner's disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "$free_gb" -lt 20 ]; then
            echo "only ${free_gb} GB free: the e2e needs about 20 GB (images, the agent's included)" >&2
            exit 1
          fi
      - run: make e2e
      - name: cluster state on failure
        if: failure()
        run: hack/e2e.sh status || true
