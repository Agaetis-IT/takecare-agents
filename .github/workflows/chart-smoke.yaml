# Installs and upgrades both charts for real on k3d with the pinned Helm 4,
# then checks the ADR 0007 installation requirements on the cluster
# (hack/chart-smoke.sh), in two parallel jobs. Runs only when what it
# exercises changes.
name: chart-smoke

on:
  push:
    branches: [main]
    paths:
      - charts/**
      - hack/**
      - internal/gatewayapi/**
      - internal/front/**
      - internal/guard/**
      - cmd/**
      - test/fakeslack/**
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - .github/workflows/chart-smoke.yaml
  pull_request:
    paths:
      - charts/**
      - hack/**
      - internal/gatewayapi/**
      - internal/front/**
      - internal/guard/**
      - cmd/**
      - test/fakeslack/**
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - .github/workflows/chart-smoke.yaml

permissions:
  contents: read

concurrency:
  group: chart-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two parallel jobs, each on its own cluster (hack/chart-smoke.sh job-a,
  # job-b): job A installs and runs the check list; job B installs, leaves
  # the install pass's writes on the chart's objects without checking them,
  # upgrades, runs the whole check list again, then the customer connector
  # and the front. Together they run every check of the former single job.
  smoke:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: job-a
            name: install on k3d, ADR 0007 checks
            # About 11 minutes: a hung run stops here instead of after
            # GitHub's six hours.
            timeout: 25
          - phase: job-b
            name: upgrade on k3d, ADR 0007 checks, customer connector and front
            # About 14 minutes.
            timeout: 30
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The steps below run unless every file of this push, or of the whole
      # pull request, is one no Go test, image or cluster reads (bench
      # reports, docs, the root's Markdown, the site; hack/ci-changes.sh).
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
        run: hack/ci-changes.sh go >>"$GITHUB_OUTPUT"
      - if: steps.changes.outputs.heavy == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The pinned chart archives, restored when the pins are the same (spec
      # 04): make chart-deps then downloads only what is missing.
      - if: steps.changes.outputs.heavy == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: charts/*/charts
          key: chart-deps-${{ hashFiles('hack/versions.env', 'charts/*/Chart.lock') }}
      # The Docker Hub images of the demo profile, pulled once and kept when
      # the pins are the same; each is checked against the Id recorded at
      # its pull before it is imported into k3d (hack/preload-images.sh).
      - if: steps.changes.outputs.heavy == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/preload
          key: preload-images-${{ hashFiles('hack/versions.env', 'charts/*/Chart.lock', 'hack/preload-images.sh') }}
      - if: steps.changes.outputs.heavy == 'true'
        name: install k3d (version and checksum from hack/versions.env)
        run: |
          set -euo pipefail
          source hack/versions.env
          curl -fsSL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256_LINUX_AMD64}  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      # The runner's disk once left about 4 GB free after the agent's image
      # was pulled, under the kubelet's eviction threshold (10 % free): the
      # cluster evicted its pods. Drop toolchains the smoke never uses when
      # the room is short (the removal takes about two minutes, and the
      # runner image of 2026-11 starts with about 88 GB free), and stop
      # early with a clear message if the room is still short.
      - if: steps.changes.outputs.heavy == 'true'
        name: free the runner's disk
        run: |
          set -euo pipefail
          df -h /
          free_gb() { df --output=avail -BG / | tail -1 | tr -dc '0-9'; }
          if [ "$(free_gb)" -lt 20 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
            df -h /
          else
            echo "$(free_gb) GB free: nothing removed"
          fi
          free=$(free_gb)
          if [ "$free" -lt 20 ]; then
            echo "only ${free} GB free: the smoke needs about 20 GB (images, the agent's included)" >&2
            exit 1
          fi
      # The images' layers in the Actions cache, in the image job's scopes
      # (Makefile, DOCKER_BUILD): the runner's Docker exports a type=gha
      # cache only through a buildx builder.
      - if: steps.changes.outputs.heavy == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The Actions cache's URL and token, for buildx's type=gha cache.
      - if: steps.changes.outputs.heavy == 'true'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - if: steps.changes.outputs.heavy == 'true'
        run: make helm
      - if: steps.changes.outputs.heavy == 'true'
        run: hack/chart-smoke.sh ${{ matrix.phase }}
      - name: cluster state on failure
        if: failure() && steps.changes.outputs.heavy == 'true'
        run: hack/chart-smoke.sh status || true
