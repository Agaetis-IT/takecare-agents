# Installs and upgrades both charts for real on k3d with the pinned Helm 4,
# then checks the ADR 0007 installation requirements on the cluster
# (hack/chart-smoke.sh). Runs only when what it exercises changes.
name: chart-smoke

on:
  push:
    branches: [main]
    paths:
      - charts/**
      - hack/**
      - internal/gatewayapi/**
      - cmd/**
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - .github/workflows/chart-smoke.yaml
  pull_request:
    paths:
      - charts/**
      - hack/**
      - internal/gatewayapi/**
      - cmd/**
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - .github/workflows/chart-smoke.yaml

permissions:
  contents: read

concurrency:
  group: chart-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: install and upgrade on k3d, ADR 0007 checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install k3d (version and checksum from hack/versions.env)
        run: |
          set -euo pipefail
          source hack/versions.env
          curl -fsSL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256_LINUX_AMD64}  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      # The runner's disk left about 4 GB free once the agent's image was
      # pulled, under the kubelet's eviction threshold (10 % free): the
      # cluster evicted its pods. Drop toolchains the smoke never uses, and
      # stop early with a clear message if the room is still short.
      - name: free the runner's disk
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "$free_gb" -lt 20 ]; then
            echo "only ${free_gb} GB free: the smoke needs about 20 GB (images, the agent's included)" >&2
            exit 1
          fi
      - run: make chart-smoke
      - name: cluster state on failure
        if: failure()
        run: hack/chart-smoke.sh status || true
