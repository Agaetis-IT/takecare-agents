# The release (spec 04), on a tag v<SemVer> pushed by a maintainer
# (docs/release.md): the nine images for amd64 and arm64, the three charts as
# OCI artifacts, the takecare command's binaries for linux, darwin and
# windows on amd64 and arm64, with their checksums and one SBOM per binary
# (spec 13), and the GitHub release with the tag's CHANGELOG section and
# one SBOM per image and architecture (never committed). A
# prerelease tag (v0.1.0-rc.1) runs the same chain, marked prerelease.
# Nothing published is ever replaced: a version already in the registry
# stops the release. On pull requests, a dry run packages and lints the
# charts, reads the Unreleased notes, writes the SBOM of a built binary and
# builds the takecare binaries, their checksums and SBOMs, with no login
# and no push.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yaml
      - hack/ci-changes.sh
      - hack/ci-changes-test.sh
      - hack/release-notes.sh
      - hack/release-notes-test.sh
      - hack/sbom.sh
      - hack/sbom-test.sh
      - hack/takecare-dist.sh
      - hack/testdata/sbom-image.spdx.json
      - hack/versions.env
      - hack/testdata/changelog.md
      - charts/**
      - CHANGELOG.md
      - Makefile
      - go.mod

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: release dry run (charts packaged and linted, notes read, SBOMs and takecare binaries written)
    # checks: read for hack/ci-changes.sh, which reads this job's run at
    # the previous head; nothing else beyond the workflow's contents: read.
    permissions:
      contents: read
      checks: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The steps below run unless every file of this push, or of the whole
      # pull request, is one the dry run does not read (bench reports, docs,
      # the root's Markdown but CHANGELOG.md, the site; hack/ci-changes.sh).
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          # The previous head's run of this job (hack/ci-changes.sh).
          CHECK: release dry run (charts packaged and linted, notes read, SBOMs and takecare binaries written)
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: hack/ci-changes.sh release >>"$GITHUB_OUTPUT"
      # The pinned chart archives, restored when the pins are the same (spec
      # 04): make chart-deps then downloads only what is missing.
      - if: steps.changes.outputs.heavy == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: charts/*/charts
          key: chart-deps-${{ hashFiles('hack/versions.env', 'charts/*/Chart.lock') }}
      - if: steps.changes.outputs.heavy == 'true'
        run: make release-notes-test
      # The section in progress, or the one a release PR has just cut (its
      # Unreleased is then empty).
      - if: steps.changes.outputs.heavy == 'true'
        name: the notes of the next release
        run: |
          set -euo pipefail
          for v in $(grep -oE '^## \[[^]]+\]' CHANGELOG.md | sed -E 's/^## \[(.*)\]$/\1/' | head -2); do
            if hack/release-notes.sh "$v" >/dev/null; then echo "notes of ${v}: OK"; exit 0; fi
          done
          echo "neither Unreleased nor the latest section of CHANGELOG.md has an entry" >&2
          exit 1
      - if: steps.changes.outputs.heavy == 'true'
        run: make chart-package RELEASE_VERSION=0.0.0-dryrun
      - if: steps.changes.outputs.heavy == 'true'
        run: make sbom-test
      # The release reads the pushed images; with nothing pushed, the dry run
      # reads the operator's binary built as the image builds it. No Go cache:
      # a tag runs this workflow too, and a cache restored there is a
      # poisoning path (zizmor's cache-poisoning audit).
      - if: steps.changes.outputs.heavy == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - if: steps.changes.outputs.heavy == 'true'
        name: the SBOM of a built binary
        run: |
          set -euo pipefail
          make syft
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o bin/operator-dryrun ./cmd/operator
          hack/sbom.sh scan file:bin/operator-dryrun takecare-agents-operator 0.0.0-dryrun linux/amd64 bin/sbom/dryrun.spdx.json
          ls -l bin/sbom/dryrun.spdx.json
          jq -r '.packages[0:5][] | [.name, .versionInfo] | @tsv' bin/sbom/dryrun.spdx.json
      # go install …/cmd/takecare@vX refuses a module whose go.mod has
      # replace or exclude directives (Go modules reference, go install).
      - if: steps.changes.outputs.heavy == 'true'
        name: the takecare binaries, checksums and SBOMs
        run: |
          set -euo pipefail
          go mod edit -json | jq -e '((.Replace // []) + (.Exclude // [])) | length == 0' >/dev/null ||
            { echo "go.mod has replace or exclude directives: go install …/cmd/takecare@<version> would fail" >&2; exit 1; }
          test "$(go list -m)" = github.com/agaetis-it/takecare-agents
          make takecare-dist RELEASE_VERSION=0.0.0-dryrun
          ls -l bin/dist

  release:
    name: publish the release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The pinned chart archives, restored when the pins are the same (spec
      # 04): make chart-deps then downloads only what is missing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: charts/*/charts
          key: chart-deps-${{ hashFiles('hack/versions.env', 'charts/*/Chart.lock') }}
      - name: check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "${TAG} is not v<SemVer>: nothing is published" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "${TAG} is not on main: a tag on a branch does not publish (docs/release.md)" >&2
            exit 1
          fi
          version="${TAG#v}"
          # The cut sets the charts' version (docs/release.md step 2): a tag
          # whose charts say another version publishes nothing.
          for chart in takecare-crds takecare takecare-cluster; do
            for key in version appVersion; do
              got="$(sed -nE "s/^${key}: *//p" "charts/${chart}/Chart.yaml")"
              if [[ "$got" != "$version" ]]; then
                echo "charts/${chart}/Chart.yaml has ${key} ${got}, the tag says ${version}: cut the charts first (docs/release.md step 2)" >&2
                exit 1
              fi
            done
          done
          hack/release-notes.sh "$version" >"$RUNNER_TEMP/notes.md"
          # The registry is a pinned constant: hack/versions.env only.
          source hack/versions.env
          { echo "VERSION=${version}"; echo "REGISTRY=${IMAGE_REGISTRY}"; } >>"$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: helm login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          make helm
          source hack/versions.env
          printf '%s' "$GH_TOKEN" | "bin/helm-${HELM_VERSION}" registry login ghcr.io -u "$ACTOR" --password-stdin
      # Only a not-found answer means absent: any other error (a registry
      # hiccup, a denied pull) stops the release rather than risk a replace.
      - name: refuse to replace a published version
        run: |
          set -euo pipefail
          source hack/versions.env
          absent() { # NAME COMMAND...
            local out
            if out="$("${@:2}" 2>&1)"; then
              echo "$1 ${VERSION} is already published: release a new version (fix forward)" >&2
              return 1
            fi
            if grep -qiE 'not found|manifest unknown|name unknown' <<<"$out"; then return 0; fi
            printf 'cannot tell whether %s %s is published:\n%s\n' "$1" "$VERSION" "$out" >&2
            return 1
          }
          for image in operator mcp-report-slack demo-app mcp-corpus mcp-map mcp-front mcp-history mcp-code mcp-releases; do
            absent "image takecare-agents-${image}" docker buildx imagetools inspect "${REGISTRY}/takecare-agents-${image}:${VERSION}"
          done
          for chart in takecare-crds takecare takecare-cluster; do
            absent "chart ${chart}" "bin/helm-${HELM_VERSION}" show chart "oci://${REGISTRY}/charts/${chart}" --version "$VERSION"
          done
      # syft is fetched (and its checksum checked) before anything is pushed,
      # so a failed download stops the release with nothing published.
      - name: syft
        run: make syft
      # No Go cache on a tag (cache poisoning, zizmor).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: takecare binaries, checksums and SBOMs (built before anything is pushed)
        run: make takecare-dist RELEASE_VERSION="$VERSION"
      - name: images (amd64 + arm64)
        run: make docker-buildx PUSH=true VERSION="$VERSION"
      - name: charts
        run: |
          set -euo pipefail
          make chart-package RELEASE_VERSION="$VERSION"
          source hack/versions.env
          for chart in takecare-crds takecare takecare-cluster; do
            "bin/helm-${HELM_VERSION}" push "bin/charts/${chart}-${VERSION}.tgz" "oci://${REGISTRY}/charts"
          done
      # One SBOM per image and architecture (SPDX 2.3 JSON), read from the
      # images just pushed, by digest: the binary's Go modules and the base's
      # Debian packages. Attached to the release below, never committed. An
      # empty SBOM stops the release before the release page exists.
      - name: SBOMs
        run: |
          set -euo pipefail
          source hack/versions.env
          mkdir -p bin/sbom
          for image in operator mcp-report-slack demo-app mcp-corpus mcp-map mcp-front mcp-history mcp-code mcp-releases; do
            ref="${REGISTRY}/takecare-agents-${image}:${VERSION}"
            digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er .digest)"
            for platform in ${IMAGE_PLATFORMS//,/ }; do
              hack/sbom.sh scan "registry:${REGISTRY}/takecare-agents-${image}@${digest}" \
                "takecare-agents-${image}" "$VERSION" "$platform" \
                "bin/sbom/takecare-agents-${image}-${VERSION}-${platform//\//-}.spdx.json"
            done
          done
          test "$(find bin/sbom -name '*.spdx.json' | wc -l)" -eq 18
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            cat "$RUNNER_TEMP/notes.md"
            printf '\n### Artifacts\n\nImages (linux/amd64, linux/arm64):\n\n'
            for image in operator mcp-report-slack demo-app mcp-corpus mcp-map mcp-front mcp-history mcp-code mcp-releases; do
              printf -- "- \`%s/takecare-agents-%s:%s\`\n" "$REGISTRY" "$image" "$VERSION"
            done
            printf '\nCharts:\n\n'
            for chart in takecare-crds takecare takecare-cluster; do
              printf -- "- \`oci://%s/charts/%s --version %s\`\n" "$REGISTRY" "$chart" "$VERSION"
            done
            printf '\nThe takecare command (linux, darwin, windows; amd64, arm64), attached below with takecare-%s-checksums.txt and one SBOM per binary, or:\n\n' "$VERSION"
            printf -- "- \`go install github.com/agaetis-it/takecare-agents/cmd/takecare@v%s\`\n" "$VERSION"
            printf '\nSBOMs (SPDX 2.3 JSON, one per image and architecture, and one per takecare binary), attached below.\n'
          } >"$RUNNER_TEMP/release.md"
          test "$(find bin/dist -maxdepth 1 -type f | wc -l)" -eq 13
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" "${prerelease[@]}" --verify-tag --title "TakeCare Agents ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release.md" "bin/charts/takecare-crds-${VERSION}.tgz" "bin/charts/takecare-${VERSION}.tgz" \
            "bin/charts/takecare-cluster-${VERSION}.tgz" bin/sbom/*.spdx.json bin/dist/*
