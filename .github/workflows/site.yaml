# The product site (site/), built on every release tag and published to
# GitHub Pages only from a final release tag (vX.Y.Z) on main, or by hand
# (workflow_dispatch) from main or from a final tag on main, so that its
# Reference matches the released CRDs and charts. Anything else only builds
# it, and the published site stays at the last final release
# (hack/site-deploy.sh decides, hack/site-deploy-test.sh checks it). The
# deploy job waits for an approval on the github-pages environment, and
# runs one at a time across every ref (docs/release.md). On pull requests
# touching the site, a build checks that the English rendering still
# applies (site/src/i18n_en.py) and that the Reference reads.
#
# Pages must use the source "GitHub Actions" (repository settings); the
# github-pages environment must allow main and the v* tags to deploy.
name: site

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - site/**
      - config/crd/**
      - charts/*/README.md
      - charts/takecare/values-prod.yaml
      - hack/versions.env
      - Makefile
      - .github/workflows/site.yaml
      - hack/ci-changes.sh
      - hack/ci-changes-test.sh
      - hack/site-deploy.sh
      - hack/site-deploy-test.sh
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: build the site
    # checks: read for hack/ci-changes.sh, which reads this job's run at
    # the previous head; nothing else beyond the workflow's contents: read.
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-24.04
    # A newer build of the same ref replaces an older one.
    concurrency:
      group: site-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, no file but the checked-out tree's: the "on main"
          # check needs main's commits, not its files.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      # The checks and the build run unless every file of this push, or of
      # the whole pull request, is one the site does not read (bench
      # reports, docs, the root's Markdown but CHANGELOG.md;
      # hack/ci-changes.sh). A tag or a manual run always builds.
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          # The previous head's run of this job (hack/ci-changes.sh).
          CHECK: build the site
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: hack/ci-changes.sh site >>"$GITHUB_OUTPUT"
      - if: steps.changes.outputs.heavy == 'true'
        run: make site-deploy-test
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT: ${{ github.sha }}
        run: |
          deploy="$(hack/site-deploy.sh "$EVENT" "$REF_NAME" "$REF_TYPE" "$COMMIT")"
          echo "site deploy decided: ${deploy} (event ${EVENT}, ref ${REF_NAME}, ${REF_TYPE} ${COMMIT})"
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.heavy == 'true'
        run: make site
      - if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: publish to GitHub Pages
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-24.04
    # One deploy to Pages at a time, whatever the ref; a running deploy is
    # never cancelled, and a newer pending one replaces an older pending one
    # (GitHub's concurrency rule, the Pages starter workflow's choice).
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
