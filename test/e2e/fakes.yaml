# The end-to-end tests' fakes (spec 04), in their own namespace. Each one is
# closed to everything but its one client: the gateway's proxy pods for the
# model provider, the report server for Slack. Rendered by hack/e2e.sh with
# the image tag (TAG) and created by it, never by the product chart.
apiVersion: v1
kind: Namespace
metadata:
  name: takecare-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-llm
  namespace: takecare-e2e
spec:
  replicas: 1
  selector:
    matchLabels: { app: fake-llm }
  template:
    metadata:
      labels: { app: fake-llm }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: fake-llm
          image: ghcr.io/agaetis-it/takecare-agents-fake-llm:TAG
          args: [--mode=replay, --fixtures=/fixtures]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: fixtures, mountPath: /fixtures, readOnly: true }]
      volumes:
        - name: fixtures
          configMap: { name: fake-llm-fixtures }
---
apiVersion: v1
kind: Service
metadata:
  name: fake-llm
  namespace: takecare-e2e
spec:
  selector: { app: fake-llm }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fake-llm-ingress
  namespace: takecare-e2e
spec:
  podSelector:
    matchLabels: { app: fake-llm }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: takecare-system }
          podSelector:
            matchLabels: { gateway.networking.k8s.io/gateway-name: agentgateway-proxy }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-slack
  namespace: takecare-e2e
spec:
  replicas: 1
  selector:
    matchLabels: { app: fake-slack }
  template:
    metadata:
      labels: { app: fake-slack }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: fake-slack
          image: ghcr.io/agaetis-it/takecare-agents-fake-slack:TAG
          args: [--token-file=/token/token]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: token, mountPath: /token, readOnly: true }]
      volumes:
        - name: token
          secret: { secretName: fake-slack-token }
---
apiVersion: v1
kind: Service
metadata:
  name: fake-slack
  namespace: takecare-e2e
spec:
  selector: { app: fake-slack }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fake-slack-ingress
  namespace: takecare-e2e
spec:
  podSelector:
    matchLabels: { app: fake-slack }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: takecare-system }
          podSelector:
            matchLabels: { takecare.agaetis.fr/addon: report-slack }
      ports: [{ protocol: TCP, port: 8080 }]
