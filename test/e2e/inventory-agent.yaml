#
# An Agent in the demo Intendant's scope, for its inventory (spec 10 §8):
# listed through the kubernetes connector whatever its state. It stays
# inert because kagent does not watch demo-apps: the chart gives kagent
# Roles in its own namespace only (kagent.rbac.namespaces: [kagent]), from
# which kagent v0.10.6 derives WATCH_NAMESPACES. The rest is a second
# guard: a BYO agent with no replica (deployment.replicas is passed through
# as is), and an image under the reserved .invalid domain, never pulled.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: e2e-inventory
  namespace: demo-apps
spec:
  type: BYO
  description: An agent of the inventory check, never run.
  byo:
    deployment:
      image: registry.invalid/none:0
      replicas: 0
