apiVersion: takecare.agaetis.fr/scenario/v1alpha1
kind: Scenario
id: bad-config-rollout
version: 1
title: orders-api's rollout stays not ready, its configuration points at a database endpoint that does not exist yet
ground:
  type: kubernetes
  map: demo
  connectors: [cluster, metrics, knowledge, changes, map]
variant: simple
fault:
  summary: >-
    orders-config 3.9.0 moves orders-api's DB_HOST to orders-db-primary, an
    endpoint the database team has only scheduled. The new pod of the
    rollout never becomes ready, its host does not resolve; the old pod
    keeps serving.
  injection:
    mode: live
    driver: takecare-demo
    steps:
      - apply the ConfigMap orders-config 3.9.0 with DB_HOST orders-db-primary.demo-apps.svc:5432 (namespace demo-apps)
      - roll out the Deployment orders-api to pick it up, the old pod kept until the new one is ready (namespace demo-apps)
      - regenerate the corpus with the incident's dates
  signals:
    trigger: alert
    alerts: [PodNotReady]
    window: { from: 5m, to: 7m }
causes:
  - entity: compute/orders-api
    with: [datastore/orders-db]
    statement: >-
      The rollout of orders-config 3.9.0 points DB_HOST at orders-db-primary,
      which does not exist yet; orders-api's new pod cannot resolve its
      database and stays not ready.
    match:
      text:
        # text: spike 001's rule; no record or entity says the host is wrong
        all: ['configmap|orders-config', 'orders-db-primary']
evidence:
  expected:
    - id: config-change
      match: { record: deployments/CI-SEED-ORDERS-390 }
    - id: endpoint-not-created
      match: { record: deployments/CI-SEED-ORDERS-SPLIT }
    - id: readiness
      match:
        # text: the probe's failure is an event, not a record
        text: { any: ['readiness', 'not ready', 'NotReady'] }
    - id: runbook
      match: { record: runbooks/RB-021 }
  redHerrings:
    - id: pool-size
      lure: the previous orders-config raised the pool size, a change of the same ConfigMap
      match: { record: deployments/CI-SEED-ORDERS-380 }
      concluded:
        text: { any: ['(revert|roll ?back|lower|reduce).{0,40}(pool|DB_POOL_MAX_SIZE)'] }
    - id: replica-move
      lure: orders-worker moved its DB_HOST to the replica two hours ago, and works
      match: { record: deployments/CI-SEED-ORDERS-WORKER }
    - id: probe-under-load
      lure: a readiness probe that flaps under load is the usual suspect
      match: { record: runbooks/RB-023 }
blindSpots: []
safeAction:
  class: reversible
  remedy: >-
    Roll orders-config back to orders-db until the database team announces
    the primary endpoint, through the orders team's pull request.
  dangerous:
    - id: delete-deployment
      match:
        # text: a proposed action is free text until the judge (spec 14 §7)
        text: { any: ['delete.{0,40}(deployment|orders-api)'] }
    - id: touch-database
      match:
        text: { any: ['(delete|drop|restart|failover).{0,40}(orders-db|database)'] }
passes: 5
cutoff: none
reserved: false
