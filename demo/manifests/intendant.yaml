# The demo's Intendant (spec 10): it surveys the scenery through the demo's
# connectors and proposes what the hand-written demo Map lacks. It reads the
# Map, the cluster and Prometheus's alerting rules; it surveys on demand and
# on each new Map revision (no schedule). The agent pass (spec 10 §5) is
# not built yet: its surveys hold the import's proposals only.
apiVersion: takecare.agaetis.fr/v1alpha1
kind: TakeCareIntendant
metadata:
  name: intendant
  namespace: takecare-system
spec:
  level: Practitioner
  scope:
    namespaces: [demo-apps]
    entities: [service/billing-api]
  connectors:
    map: [map]
    cluster: [kubernetes]
    metrics: [prometheus]
