# The demo's Intendant (spec 10): it surveys the scenery through the demo's
# connectors and proposes what the hand-written demo Map lacks, and posts a
# digest of each survey's proposals to the review destination. It reads the
# Map, the cluster and Prometheus's alerting rules; it surveys on demand and
# on each new Map revision (no schedule). Its agent pass (spec 10 §5) reads
# the cluster and the runbooks, and proposes what the import cannot see.
apiVersion: takecare.agaetis.fr/v1alpha1
kind: TakeCareIntendant
metadata:
  name: intendant
  namespace: takecare-system
spec:
  level: Practitioner
  scope:
    namespaces: [demo-apps]
    entities: [service/billing-api]
  connectors:
    map: [map]
    cluster: [kubernetes]
    metrics: [prometheus]
    knowledge: [runbooks]
    report: report
  report:
    practitioner: review
