# The demo's Doc (spec 03): level Practitioner, reading the scenery's namespace
# through the demo's connectors, publishing to the on-call destination of
# the report connector (Slack, or the report server's log without a token).
apiVersion: takecare.agaetis.fr/v1alpha1
kind: TakeCareDoc
metadata:
  name: doc
  namespace: takecare-system
spec:
  level: Practitioner
  scope:
    namespaces: [demo-apps]
    entities: [service/billing-api]   # covered through the demo's Map
  contentTools: [pods_log]
  connectors:
    cluster: [kubernetes]
    metrics: [prometheus]
    knowledge: [incidents, runbooks, vendor]
    changes: [deployments]
    tickets: [support]
    map: [map]
    report: report
  report:
    practitioner: on-call
