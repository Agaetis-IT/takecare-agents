#
# gitleaks: the default rules, plus one allowlist. hack/versions.env pins
# release checksums (64 hexadecimal characters under *_SHA256* keys); a key
# that also contains "API" (GATEWAY_API_INSTALL_SHA256) trips the generic
# API key rule. Only that shape, in that file, is allowed.
title = "TakeCare Agents"

[extend]
useDefault = true

[allowlist]
description = "release checksums pinned in hack/versions.env"
paths = ['''^hack/versions\.env$''']
regexTarget = "line"
regexes = ['''^[A-Z0-9_]*SHA256[A-Z0-9_]*=[0-9a-f]{64}$''']
