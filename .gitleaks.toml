#
# gitleaks: the default rules, plus two allowlists. hack/versions.env pins
# release checksums (64 hexadecimal characters under *_SHA256* keys); a key
# that also contains "API" (GATEWAY_API_INSTALL_SHA256) trips the generic
# API key rule. Only that shape, in that file, is allowed.
title = "TakeCare Agents"

[extend]
useDefault = true

[[allowlists]]
description = "release checksums pinned in hack/versions.env"
condition = "AND"
paths = ['''(^|/)hack/versions\.env$''']
regexTarget = "line"
regexes = ['''^[A-Z0-9_]*SHA256[A-Z0-9_]*=[0-9a-f]{64}$''']

# Map entries (spec 08) start with `key: <type>/<name>`, which the generic
# API key rule reads as a key. Only that line, in a Map file, is allowed.
[[allowlists]]
description = "the key line of a Map entry"
condition = "AND"
paths = ['''(^|/)map/[a-z]+/[a-z0-9][-a-z0-9.]*\.yaml$''']
regexTarget = "line"
regexes = ['''^key: (service|compute|datastore|storage|network|identity|external|team|environment|observability|runbook)/[a-z0-9]([-a-z0-9.]*[a-z0-9])?$''']

# The discovery's golden output (spec 10 §4) quotes Map entries: their
# `"key": "<type>/<name>"` field and the `key: <type>/<name>` line inside a
# proposal's YAML. Only those shapes, in that directory, are allowed.
[[allowlists]]
description = "Map keys quoted in the discovery's golden output"
condition = "AND"
paths = ['''(^|/)internal/discovery/testdata/[a-z0-9-]+\.json$''']
regexTarget = "match"
regexes = ['''key\W{1,4}(service|compute|datastore|storage|network|identity|external|team|environment|observability|runbook)/[a-z0-9]([-a-z0-9.]*[a-z0-9])?''']
