# SPDX-FileCopyrightText: 2026 Agaetis
# SPDX-License-Identifier: Apache-2.0
#
# Copyright and licence of the files that cannot carry an SPDX header
# (REUSE specification 3.3): the product site's images, video and fonts.
# Everything else carries its own header (docs/licensing.md). The licence
# texts are in LICENSES/ and site/assets/fonts/.
version = 1

[[annotations]]
path = ["site/assets/img/*.webp", "site/assets/video/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Agaetis"
SPDX-License-Identifier = "LicenseRef-Agaetis-All-Rights-Reserved"

[[annotations]]
path = "site/assets/img/lg/**"
precedence = "override"
SPDX-FileCopyrightText = "Their respective trademark owners"
SPDX-License-Identifier = "LicenseRef-Third-Party-Trademarks"

[[annotations]]
path = "site/assets/fonts/poppins-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2020 The Poppins Project Authors (https://github.com/itfoundry/Poppins)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "site/assets/fonts/ibm-plex-mono-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp. with Reserved Font Name \"Plex\""
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "site/assets/fonts/OFL-*.txt"
precedence = "override"
SPDX-FileCopyrightText = ["2020 The Poppins Project Authors", "2017 IBM Corp."]
SPDX-License-Identifier = "OFL-1.1"
